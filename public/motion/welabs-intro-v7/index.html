<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Welabs · Abertura</title>
<style>
/* BASE DA ABERTURA (marca âmbar: fundo grafite, texto Inter; cores em assets/brand/welabs-brand.js) */
@font-face{font-family:"Inter";src:url("./assets/fonts/Inter-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:#10141C}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:#10141C;font-family:"Inter",sans-serif;color:#fff}
#bg,#fg{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
.lbl{position:absolute;font-size:32px;font-weight:600;letter-spacing:-.005em;line-height:40px;color:#F2F2F5;opacity:0;white-space:nowrap}
.lbl.in{left:150px}
.lbl.out{right:150px;text-align:right;font-weight:600}
/* v5: labels are the official motion logos (assets/brand/welabs-motion.js fills every [data-wl-motion] host with the
   whole SVG, sizes it by height at data-wl-scale px per logo unit and lowers it onto the text baseline) */
.lbl .lg{display:inline-block}
/* v5: closing Welabs logo, 905x213 logo box at 1.2 px per unit, centered above the editorial line (as the v4 canvas) */
#wl{position:absolute;left:417px;top:372px}
#line{position:absolute;left:0;top:688px;width:1920px;text-align:center;font-size:42px;font-weight:500;letter-spacing:-.015em;line-height:1.2;color:#E6E6EC;opacity:0}
</style>
</head>
<body>
<div id="root" data-composition-id="welabs-intro-v7" data-width="1920" data-height="1080" data-duration="8.5">
  <canvas id="bg" width="1920" height="1080" aria-hidden="true"></canvas>
  <canvas id="fg" width="1920" height="1080" aria-hidden="true"></canvas>
  <!-- v2: five named products only; rows at y 260/400/540/680/820 (choreography.js IN_Y) -->
  <!-- v5: final pack; every label is the product's official motion logo (brand/vector/motion/<slug>-dark.svg), all at
       the same 0.11816 px per logo unit, so the x-height matches across logos -->
  <!-- v6 (brand 1.2.1): the motion logos come from the 1.2.1 package (motion/<slug>-dark.svg); all five products carry
       the sign inside the name (Domus: encaixe in place of the "o"; Magneto: Ibrand "m" with an amber pole) -->
  <div class="lbl in" id="in0" style="top:206px"><span class="lg" id="in0n" role="img" aria-label="magneto" data-wl-motion="magneto" data-wl-scale="0.11816"></span></div>
  <div class="lbl in" id="in1" style="top:346px"><span class="lg" id="in1n" role="img" aria-label="domus" data-wl-motion="domus" data-wl-scale="0.11816"></span></div>
  <div class="lbl in" id="in2" style="top:486px"><span class="lg" id="in2n" role="img" aria-label="knowly" data-wl-motion="knowly" data-wl-scale="0.11816"></span></div>
  <!-- Lower streams rise toward the knot, so their labels sit below the line -->
  <div class="lbl in" id="in3" style="top:692px"><span class="lg" id="in3n" role="img" aria-label="relloo" data-wl-motion="relloo" data-wl-scale="0.11816"></span></div>
  <div class="lbl in" id="in4" style="top:832px"><span class="lg" id="in4n" role="img" aria-label="tuner" data-wl-motion="tuner" data-wl-scale="0.11816"></span></div>
  <div class="lbl out" id="out0" style="top:276px">SaaS</div>
  <div class="lbl out" id="out1" style="top:486px">Apps</div>
  <div class="lbl out" id="out2" style="top:696px">Portais</div>
  <!-- v5: the closing logo is the official Welabs motion SVG ("we" grows with overshoot, "labs" opens) -->
  <div id="wl" role="img" aria-label="welabs" data-wl-motion="welabs" data-wl-scale="1.2"></div>
  <div id="line">Produtos que se encaixam, num só fluxo</div>
</div>
<script src="./assets/js/gsap.min.js"></script>
<script src="./assets/js/shaders.js"></script>
<script src="./assets/brand/welabs-brand.js"></script>
<script src="./assets/brand/welabs-motion.js"></script>
<script src="./assets/js/choreography.js"></script>
<script>
// RENDER DETERMINÍSTICO DA ABERTURA (WebGL2 no fundo + Canvas 2D por cima, dirigidos pela timeline)
(function () {
  var W = 1920, H = 1080, DURATION = 8.5;
  var bg = document.getElementById('bg');
  var ctx = document.getElementById('fg').getContext('2d');
  var gl = bg.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: true });
  var prog = null, uni = {}, vao = null;

  function compile() {
    var p = gl.createProgram();
    [[gl.VERTEX_SHADER, VS_QUAD], [gl.FRAGMENT_SHADER, FS_FIELD]].forEach(function (s) {
      var sh = gl.createShader(s[0]); gl.shaderSource(sh, s[1]); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
      gl.attachShader(p, sh); gl.deleteShader(sh);
    });
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    ['uRes', 'uFade', 'uFocus', 'uFocusAmt', 'uSettle'].forEach(function (n) { uni[n] = gl.getUniformLocation(p, n); });
    vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0); gl.bindVertexArray(null);
    return p;
  }
  if (gl) prog = compile();

  function render(t) {
    var f = SC.focusAt(t);
    if (gl && prog) {
      gl.viewport(0, 0, W, H); gl.useProgram(prog);
      gl.uniform2f(uni.uRes, W, H); gl.uniform1f(uni.uFade, SC.fadeAt(t));
      gl.uniform2f(uni.uFocus, f.p[0], f.p[1]); gl.uniform1f(uni.uFocusAmt, f.amt); gl.uniform1f(uni.uSettle, SC.settleAt(t));
      gl.bindVertexArray(vao); gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    SC.drawScene(ctx, t);
  }

  // TIMELINE (a única fonte de tempo): tween linear sobre um proxy dirige o render; logos, rótulos e frase são DOM
  var proxy = { t: 0 };
  var tl = gsap.timeline({ paused: true });
  tl.to(proxy, { t: DURATION, duration: DURATION, ease: 'none', onUpdate: function () { render(proxy.t); } }, 0);
  // v5: each label plays its official motion (brand/vector/motion keyframes, 4.8 s cycle at half speed, so a logo
  // is whole 1.4 s after its stream starts) and holds on the still logo until the streams collapse
  var LABEL_SPEED = 0.5;
  SC.IN_T0.forEach(function (t0, i) {
    tl.fromTo('#in' + i, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: 'none' }, t0 + 0.05);
    WELABS_MOTION.play(tl, '#in' + i + 'n', t0 + 0.05, LABEL_SPEED);
    tl.to('#in' + i, { opacity: 0, x: 24, duration: 0.3, ease: 'power2.in' }, SC.COL_T0 + 0.02 * i);
  });
  SC.OUT_T0.forEach(function (t0, j) {
    tl.fromTo('#out' + j, { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: 0.4, ease: 'power2.out' }, t0 + 0.4);
    tl.to('#out' + j, { opacity: 0, x: -24, duration: 0.3, ease: 'power2.in' }, SC.COL_T0 + 0.06 + 0.02 * j);
  });
  // v5: the knot glides into the "we" and the official Welabs motion takes over there (cycle at 0.75 speed)
  WELABS_MOTION.play(tl, '#wl', SC.LOGO_T0, SC.LOGO_SPEED);
  tl.fromTo('#line', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, SC.TAGLINE_T0);
  render(0);
  window.__timelines = window.__timelines || {};
  window.__timelines["welabs-intro-v7"] = tl;
})();
</script>
</body>
</html>
