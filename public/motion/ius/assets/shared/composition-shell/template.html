<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>{{title}}</title>
    <link rel="stylesheet" href="assets/shared/product-motion-kit.css">
    <link rel="stylesheet" href="{{stylesheet}}">
    <style>
      :root {
        box-sizing: border-box;
      }
      *, *::before, *::after {
        box-sizing: inherit;
      }
      html, body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #root {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        box-sizing: border-box;
      }
      #product-stage {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-wof0" id="root" data-composition-id="{{compositionId}}" data-width="1920" data-height="1080" data-duration="{{duration}}">
      <main data-hf-id="hf-scna" id="product-stage" class="product-stage"></main>
    </div>
    <script src="assets/shared/gsap.min.js"></script>
    <script type="module">
      import { buildComposition } from "./{{entry}}";
      window.__timelines = window.__timelines || {};
      const completed = await buildComposition();
      window.__timelines["{{compositionId}}"] = completed.timeline;
      window.__hfForceTimelineRebind?.();
    </script>
  </body>
</html>
