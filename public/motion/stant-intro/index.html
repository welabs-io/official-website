<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Stant · Abertura</title>
<style>
/* BASE DA ABERTURA */
@font-face{font-family:Inter;src:url("./assets/fonts/Inter-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:#0A2E58}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:#0A2E58;font-family:Inter,sans-serif;color:#fff}
#bg,#fg{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
#line{position:absolute;left:0;top:648px;width:1920px;text-align:center;font-size:48px;font-weight:600;letter-spacing:-.015em;line-height:1.2;color:#EAF1F8;opacity:0;text-shadow:0 2px 18px rgba(2,16,34,.45)}
</style>
</head>
<body>
<div id="root" data-composition-id="stant-intro" data-width="1920" data-height="1080" data-duration="8.5">
  <canvas id="bg" width="1920" height="1080" aria-hidden="true"></canvas>
  <canvas id="fg" width="1920" height="1080" aria-hidden="true"></canvas>
  <div id="line">Qualidade de obra, do campo à gestão</div>
</div>
<script src="./assets/js/gsap.min.js"></script>
<script src="./assets/js/shaders.js"></script>
<script src="./assets/js/logo-data.js"></script>
<script src="./assets/js/choreography.js"></script>
<script>
// RENDER DETERMINÍSTICO DA ABERTURA (WebGL2 no fundo + Canvas 2D por cima, dirigidos pela timeline)
(function () {
  var W = 1920, H = 1080, DURATION = 8.5;
  var bg = document.getElementById('bg');
  var ctx = document.getElementById('fg').getContext('2d');
  var gl = bg.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: true });
  var prog = null, uni = {}, vao = null, curT = 0;

  function compile() {
    var p = gl.createProgram();
    [[gl.VERTEX_SHADER, VS_QUAD], [gl.FRAGMENT_SHADER, FS_BLUEPRINT]].forEach(function (s) {
      var sh = gl.createShader(s[0]); gl.shaderSource(sh, s[1]); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
      gl.attachShader(p, sh); gl.deleteShader(sh);
    });
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    ['uRes', 'uT', 'uFade', 'uFocus', 'uFocusAmt', 'uSettle'].forEach(function (n) { uni[n] = gl.getUniformLocation(p, n); });
    vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0); gl.bindVertexArray(null);
    return p;
  }
  if (gl) prog = compile();

  function render(t) {
    curT = t;
    var f = SC.focusAt(t);
    if (gl && prog) {
      gl.viewport(0, 0, W, H); gl.useProgram(prog);
      gl.uniform2f(uni.uRes, W, H); gl.uniform1f(uni.uT, t); gl.uniform1f(uni.uFade, SC.fadeAt(t));
      gl.uniform2f(uni.uFocus, f.p[0], f.p[1]); gl.uniform1f(uni.uFocusAmt, f.amt); gl.uniform1f(uni.uSettle, SC.settleAt(t));
      gl.bindVertexArray(vao); gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    SC.drawScene(ctx, t);
  }
  // Canvas text needs the face loaded; redraw the current frame once it is
  if (document.fonts && document.fonts.load) document.fonts.load('600 24px Inter').then(function () { render(curT); });

  // TIMELINE (a única fonte de tempo): tween linear sobre um proxy dirige o render; a frase entra depois do wordmark
  var proxy = { t: 0 };
  var tl = gsap.timeline({ paused: true });
  tl.to(proxy, { t: DURATION, duration: DURATION, ease: 'none', onUpdate: function () { render(proxy.t); } }, 0);
  tl.fromTo('#line', { opacity: 0, y: -22 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, SC.TAGLINE_T0);
  render(0);
  window.__timelines = window.__timelines || {};
  window.__timelines['stant-intro'] = tl;
})();
</script>
</body>
</html>
