<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Abertura Relloo (definitiva s2-r3, tagline do primeiro oi ao fechamento)</title>
<meta name="viewport" content="width=1920, height=1080">
<style>
/* BASE DA ABERTURA CONCEITUAL (mesma base das aberturas do Magneto e do Domus; a cena inteira é desenhada pela coreografia do Relloo) */
@font-face{font-family:"Inter";src:url("../../_shared/vendor/fonts/Inter-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
html,body{margin:0;background:#10141C}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#10141C;font-family:"Inter",sans-serif;color:#E6E6EC}
.role{position:absolute;left:0;width:1920px;height:56px;display:flex;flex-direction:column;align-items:center}
.bar{display:block;width:72px;height:4px;border-radius:2px;background:#FFB020;transform-origin:50% 50%;transform:scaleX(0)}
.word{display:block;margin-top:6px;font-size:44px;font-weight:500;letter-spacing:.02em;line-height:46px;opacity:0;white-space:nowrap}
/* Site variant: the tagline slot stays out of the picture; the choreography is untouched */
.role{display:none!important}
</style>
</head>
<body>
<div id="root" data-composition-id="relloo-intro-s2-r3" data-brand="welabs" data-width="1920" data-height="1080" data-duration="5.4" data-tagline="Do primeiro “oi” ao fechamento.">
  <!-- Abertura conceitual do Relloo: fichas de pessoa e conversas de vários canais se encaixam em zoom, a câmera recua e revela os dois "o", que se sobrepõem e viram o sinal do logo -->
  <img class="wm" alt="relloo by welabs" data-brand-src="welabs/relloo-endorsed-on-dark.svg">
  <div class="role"><span class="bar"></span><span class="word">Do primeiro “oi” ao fechamento.</span></div>
</div>
<script src="../../_shared/vendor/gsap/3.14.2/gsap.min.js"></script>
<script src="../../_shared/brand/loader.js"></script>
<script src="../../_shared/vendor/relloo-intro/1.0.1/choreography.js"></script>
<script>
// LINHA DO TEMPO DA PEÇA (coreografia Relloo 1.0.1; termina exatamente em data-duration)
// Same piece as relloo-intro-s2-r2; only the closing line changes to the Relloo tagline the operator corrected on 2026-10-09
window.__timelines = window.__timelines || {};
(function () {
  var DUR = 5.4;
  var root = document.getElementById('root');
  var tagline = root.getAttribute('data-tagline') || 'atende';
  root.querySelector('.word').textContent = tagline;
  var tl = RellooIntro.build({ root: root, duration: DUR, safe: 98 });
  window.__timelines["relloo-intro-s2-r3"] = tl;
})();
</script>
</body>
</html>
