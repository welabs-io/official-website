<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Abertura Knowly (definitiva s2, rede de conhecimento que vira o globo)</title>
<meta name="viewport" content="width=1920, height=1080">
<style>
/* BASE DA ABERTURA CONCEITUAL (mesma base das aberturas do Magneto, Domus e Relloo; a cena inteira é desenhada pela coreografia do Knowly) */
@font-face{font-family:"Inter";src:url("../../_shared/vendor/fonts/Inter-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
html,body{margin:0;background:#10141C}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#10141C;font-family:"Inter",sans-serif;color:#E6E6EC}
.role{position:absolute;left:0;width:1920px;height:56px;display:flex;flex-direction:column;align-items:center}
.bar{display:block;width:72px;height:4px;border-radius:2px;background:#FFB020;transform-origin:50% 50%;transform:scaleX(0)}
.word{display:block;margin-top:6px;font-size:44px;font-weight:500;letter-spacing:.02em;line-height:46px;opacity:0;white-space:nowrap}
/* Site variant: the tagline slot stays out of the picture; the choreography is untouched */
.role{display:none!important}
</style>
</head>
<body>
<div id="root" data-composition-id="knowly-intro-s2" data-brand="welabs" data-width="1920" data-height="1080" data-duration="5.4" data-tagline="Não é só memória, é conhecimento.">
  <!-- Abertura conceitual do Knowly: fragmentos de conhecimento se ligam por citações, a câmera recua e revela que a rede está sobre um globo, que se condensa e vira o "o" de "knowly" -->
  <img class="wm" alt="knowly by welabs" data-brand-src="welabs/knowly-endorsed-on-dark.svg">
  <div class="role"><span class="bar"></span><span class="word">Não é só memória, é conhecimento.</span></div>
</div>
<script src="../../_shared/vendor/gsap/3.14.2/gsap.min.js"></script>
<script src="../../_shared/brand/loader.js"></script>
<script src="../../_shared/vendor/knowly-intro/1.0.0/choreography.js"></script>
<script>
// LINHA DO TEMPO DA PEÇA (coreografia Knowly 1.0.0; termina exatamente em data-duration)
// Focus (0-1.6 s): the camera sits at 1.55x on five knowledge fragments that arrive fast and connect through citation lines with a travelling dot.
// Opening (1.6-2.2 s): the camera pulls back and reveals the globe (meridians and parallels) the network is drawn on; the outer edge stays at least 98 px inside the frame.
// Clack (2.3 s): the globe turns a quarter turn and condenses, the fragments shrink and fade for 0.16 s with an amber flash, the three parallels become the logo strokes.
// Then the globe shrinks onto the "o" of "knowly" (2.45-3.25), the wordmark opens to both sides, the seal and the tagline enter, and the still frame holds until 5.4 s.
window.__timelines = window.__timelines || {};
(function () {
  var DUR = 5.4;
  var root = document.getElementById('root');
  // tagline is a parameter (data-tagline); the default is the Knowly tagline decided by the operator (Inter 500, 44 px, one line)
  var tagline = root.getAttribute('data-tagline') || 'Não é só memória, é conhecimento.';
  root.querySelector('.word').textContent = tagline;
  var tl = KnowlyIntro.build({ root: root, duration: DUR, safe: 98 });
  window.__timelines["knowly-intro-s2"] = tl;
})();
</script>
</body>
</html>
