<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Abertura Domus (teste s2-r2, tagline no fecho)</title>
<meta name="viewport" content="width=1920, height=1080">
<style>
/* BASE DA ABERTURA CONCEITUAL (mesma base da abertura do Magneto; a cena inteira é desenhada pela coreografia do Domus) */
@font-face{font-family:"Inter";src:url("../../_shared/vendor/fonts/Inter-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
html,body{margin:0;background:#10141C}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#10141C;font-family:"Inter",sans-serif;color:#E6E6EC}
.role{position:absolute;left:0;width:1920px;height:56px;display:flex;flex-direction:column;align-items:center}
.bar{display:block;width:72px;height:4px;border-radius:2px;background:#FFB020;transform-origin:50% 50%;transform:scaleX(0)}
.word{display:block;margin-top:6px;font-size:44px;font-weight:500;letter-spacing:.02em;line-height:46px;opacity:0}
</style>
</head>
<body>
<div id="root" data-composition-id="domus-intro-s2-r2" data-brand="welabs" data-width="1920" data-height="1080" data-duration="5.4" data-role-word="A empresa inteira numa casa.">
  <!-- Abertura conceitual do Domus: a planta do negócio se monta em zoom, a câmera recua e revela o encaixe, que assume o lugar do "o" -->
  <img class="wm" alt="domus by welabs" data-brand-src="welabs/domus-endorsed-on-dark.svg">
  <div class="role"><span class="bar"></span><span class="word">A empresa inteira numa casa.</span></div>
</div>
<script src="../../_shared/vendor/gsap/3.14.2/gsap.min.js"></script>
<script src="../../_shared/brand/loader.js"></script>
<script src="../../_shared/vendor/domus-intro/1.0.1/choreography.js"></script>
<script>
// LINHA DO TEMPO DA PEÇA (coreografia Domus 1.0.1; termina exatamente em data-duration)
// Focus (0-1.6 s): the camera sits close on the plan; six rooms arrive one by one and lock side by side, amber doors open between them.
// Opening (1.6-2.2 s): the camera pulls back and the whole plan is revealed inside the outline of the "encaixe" symbol, whose outer edge stays at least 96 px inside the frame (safe 98 px for rounding).
// Clack (2.3 s): the plan condenses into the symbol with a short amber flash. Then the symbol shrinks onto the "o" (2.45-3.25),
// the wordmark opens both ways, seal and role word enter, and the still frame holds until 5.4 s.
// r2 of s2 (test; the product name is under trademark review): same motion and timings, the closing role slot carries the Domus tagline
// "A empresa inteira numa casa." instead of the slogan "domina", at 44 px like the Magneto r3, fully visible and still for 1.35 s.
window.__timelines = window.__timelines || {};
(function () {
  var DUR = 5.4;
  var root = document.getElementById('root');
  // roleWord is a parameter; the closing line is the Domus tagline (it takes the place of the slogan "domina")
  var roleWord = root.getAttribute('data-role-word') || 'A empresa inteira numa casa.';
  root.querySelector('.word').textContent = roleWord;
  var tl = DomusIntro.build({ root: root, duration: DUR, safe: 98 });
  window.__timelines["domus-intro-s2-r2"] = tl;
})();
</script>
</body>
</html>
