<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>SGORS · ciclo do resíduo</title>
<style>
@font-face{font-family:"Inter";src:url("./assets/fonts/Inter-roman.var.woff2") format("woff2");font-weight:100 900;font-style:normal}
:root{--bg:#0a1a14;--acc:#34d399;--fg:#fff;--mut:#a9c7ba;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.16);--warn:#fbbf24}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
#root{position:absolute;inset:0;overflow:hidden;background:radial-gradient(1200px 700px at 80% 0%,#12362a 0%,var(--bg) 60%);font-family:"Inter",sans-serif;color:var(--fg)}
.abs{position:absolute}
#wm{left:96px;top:40px;font-size:38px;font-weight:800;letter-spacing:.14em;color:var(--acc);line-height:44px}
#demo{right:96px;top:44px;font-size:26px;font-weight:600;color:var(--mut);border:2px solid var(--line);border-radius:999px;padding:4px 20px;line-height:34px}
.h1{left:96px;top:108px;width:1728px;font-size:52px;font-weight:800;line-height:60px;white-space:nowrap}
.sub{left:96px;top:178px;width:1728px;font-size:30px;font-weight:500;color:var(--mut);line-height:38px;white-space:nowrap}
.card{position:absolute;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px 22px}
.card .t{font-size:34px;font-weight:700;line-height:40px}
.card .d{font-size:26px;font-weight:500;color:var(--mut);line-height:32px;margin-top:8px}
.lbl{font-size:28px;font-weight:700;letter-spacing:.06em;color:var(--acc);line-height:36px;white-space:nowrap}
.pill{position:absolute;border:2px solid var(--line);border-radius:999px;font-size:26px;font-weight:600;color:var(--mut);text-align:center;line-height:36px;padding:4px 0;white-space:nowrap}
.warn{color:var(--warn);font-size:28px;font-weight:700;line-height:34px;white-space:nowrap}
svg.ov{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
.seal{position:absolute;border:4px solid var(--acc);border-radius:16px;background:#0a1a14;color:var(--acc);font-size:30px;font-weight:800;line-height:36px;padding:10px 20px;text-align:center;white-space:nowrap;box-shadow:0 0 0 6px rgba(52,211,153,.18)}
.logo{position:absolute;background:#fff;border-radius:18px;display:flex;align-items:center;justify-content:center}
.logo img{max-width:80%;max-height:78%;object-fit:contain}
.big .t{font-size:42px!important;line-height:48px!important}.big .d{font-size:30px!important;line-height:38px!important}
#stage>div{position:absolute;left:0;top:0;width:1920px;height:1080px}
.dot{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--acc);box-shadow:0 0 18px var(--acc)}
</style>
</head>
<body>
<div id="root" data-composition-id="biz-sgors-cycle" data-width="1920" data-height="1080" data-start="0" data-duration="23">
  <div id="wm" class="abs">SGORS</div>
  <div id="demo" class="abs">Dados DEMO</div>

  <!-- headlines -->
  <div id="heads"></div>
  <div id="stage"></div>
  <svg class="ov" id="ovl" viewBox="0 0 1920 1080"></svg>
</div>
<script src="./assets/gsap.min.js"></script>
<script>
// CONSTRUÇÃO DA CENA E LINHA DO TEMPO
(function(){
  const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
  const stage=document.getElementById('stage'), heads=document.getElementById('heads'), ovl=document.getElementById('ovl');
  const add=(h,parent)=>{const e=$(h);(parent||stage).appendChild(e);return e};
  const NS='http://www.w3.org/2000/svg';
  const sv=(tag,attrs)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);ovl.appendChild(e);return e};

  // Headlines (one per beat)
  const H=[
    ['O resíduo some entre quem gera e quem destina','E a reciclagem doméstica fica sem registro.'],
    ['Quem participa do ciclo','Seis papéis, em dois caminhos.'],
    ['Com trânsito: do manifesto ao certificado','MTR, transporte, recebimento com ajuste e CDF.'],
    ['Sem trânsito: da entrega ao recibo','Ecoponto, participante, pesagem por material e recibo.'],
    ['Os dois caminhos chegam à reciclagem','Um ciclo e uma marca: SGORS.'],
    ['Rastreável, comprovado, multi-cliente','O ciclo do resíduo, da geração ao destino final.']
  ];
  const hel=H.map((h,i)=>add(`<div id="h${i}"><div class="abs h1">${h[0]}</div><div class="abs sub">${h[1]}</div></div>`,heads));

  // Beat 1 — problem
  const b1=add('<div id="beat1"></div>');
  const n=(id,x,y,w,t,d)=>add(`<div id="${id}" class="card big" style="left:${x}px;top:${y}px;width:${w}px;height:200px"><div class="t">${t}</div><div class="d">${d}</div></div>`,b1);
  n('p1a',120,360,520,'Geração','quem gera o resíduo');
  n('p1b',1280,360,520,'Destino final','quem destina');
  n('p2a',120,680,520,'Entrega doméstica','reciclável do dia a dia');
  const l1=sv('line',{x1:660,y1:460,x2:1260,y2:460,stroke:'#a9c7ba','stroke-width':3,'stroke-dasharray':'12 12'});
  const l2=sv('line',{x1:660,y1:780,x2:1180,y2:780,stroke:'#a9c7ba','stroke-width':3,'stroke-dasharray':'12 12'});
  const q=add('<div id="q" class="abs" style="left:900px;top:415px;width:120px;text-align:center;font-size:72px;font-weight:800;color:#fbbf24;line-height:80px">?</div>',b1);
  const nr=add('<div id="nr" class="abs warn" style="left:1200px;top:760px;font-size:34px">sem registro</div>',b1);
  const dots=[0,1,2].map(i=>add(`<div class="dot" id="d1${i}" style="left:680px;top:447px"></div>`,b1));
  const dot2=add('<div class="dot" id="d20" style="left:680px;top:767px"></div>',b1);

  // Beat 2 — actors
  const b2=add('<div id="beat2"></div>');
  const roles=[['Gerador','gera o resíduo'],['Transportador','leva ao destino'],['Receptor','recebe e confere'],['Reciclador','valida item a item'],['Ponto de entrega','ecoponto ou evento'],['Participante','entrega o reciclável']];
  roles.forEach((r,i)=>add(`<div id="r${i}" class="card big" style="left:${96+(i%3)*585}px;top:${i<3?396:726}px;width:540px;height:220px"><div class="t">${r[0]}</div><div class="d">${r[1]}</div></div>`,b2));
  add('<div id="ga" class="abs lbl" style="left:96px;top:326px;font-size:32px">CAMINHO COM TRÂNSITO</div>',b2);
  add('<div id="gb" class="abs lbl" style="left:96px;top:656px;font-size:32px">CAMINHO SEM TRÂNSITO</div>',b2);
  add('<div id="gaL" class="abs" style="left:96px;top:374px;width:1710px;height:4px;background:var(--acc);border-radius:2px"></div>',b2);
  add('<div id="gbL" class="abs" style="left:96px;top:704px;width:1710px;height:4px;background:var(--acc);border-radius:2px"></div>',b2);

  // Lane A — with transit
  const laneA=add('<div id="laneA"></div>');
  add('<div id="la" class="abs lbl" style="left:96px;top:258px">COM TRÂNSITO</div>',laneA);
  const A=[['MTR','itens, quantidade e classe'],['Transporte','motorista, placa e data'],['Recebimento','item a item, com ajuste'],['CDF','agrupa as MTRs recebidas']];
  A.forEach((c,i)=>add(`<div id="a${i}" class="card" style="left:${96+i*330}px;top:310px;width:290px;height:190px"><div class="t">${c[0]}</div><div class="d">${c[1]}</div></div>`,laneA));
  const aX=i=>96+i*330;
  add('<div id="st" class="abs" style="left:96px;top:522px;width:1280px;height:50px"></div>',laneA);
  [['A receber',0],['Recebida',1],['Certificada',2]].forEach((s,i)=>add(`<div id="s${i}" class="pill" style="left:${96+i*212+214}px;top:524px;width:196px">${s[0]}</div>`,laneA));
  add('<div id="stl" class="abs" style="left:96px;top:526px;font-size:26px;font-weight:600;color:var(--mut);line-height:36px;white-space:nowrap">Status da MTR</div>',laneA);
  const tok=add('<div class="dot" id="tokA" style="left:0;top:0"></div>',laneA);

  // Optional panel (large generator), inside laneA so it scales with it
  const opt=add('<div id="opt" class="card" style="left:96px;top:590px;width:1280px;height:210px"></div>',laneA);
  add('<div id="optl" class="abs" style="left:122px;top:608px;font-size:26px;font-weight:700;color:var(--warn);line-height:32px">OPCIONAL</div>',laneA);
  add('<div id="o1" class="abs" style="left:122px;top:656px;width:330px;height:110px;border:2px solid var(--line);border-radius:14px;padding:14px 18px"><div class="t" style="font-size:32px;font-weight:700;line-height:38px">Grande gerador</div><div class="d" style="font-size:26px;color:var(--mut);line-height:32px">faz um lançamento</div></div>',laneA);
  add('<div id="o2" class="abs" style="left:510px;top:656px;width:350px;height:110px;border:2px solid var(--line);border-radius:14px;padding:14px 18px"><div class="t" style="font-size:32px;font-weight:700;line-height:38px">Reciclador</div><div class="d" style="font-size:26px;color:var(--mut);line-height:32px">analisa item a item</div></div>',laneA);
  add('<div id="ok" class="pill" style="left:880px;top:656px;width:190px;color:#0a1a14;background:var(--acc);border-color:var(--acc)">aprova</div>',laneA);
  add('<div id="no" class="pill" style="left:1084px;top:656px;width:280px;color:var(--warn);border-color:var(--warn)">recusa, com motivo</div>',laneA);
  const optAll=['opt','optl','o1','o2','ok','no'].map(x=>document.getElementById(x));

  // Lane B — without transit
  const laneB=add('<div id="laneB"></div>');
  add('<div class="abs lbl" style="left:96px;top:610px">SEM TRÂNSITO</div>',laneB);
  const B=[['Ecoponto','evento aberto ou fechado'],['Participante','ligado ao evento e ao contrato'],['Pesagem','kg por material'],['Recibo','enviado por e-mail']];
  B.forEach((c,i)=>add(`<div id="b${i}" class="card" style="left:${96+i*330}px;top:660px;width:290px;height:200px"><div class="t">${c[0]}</div><div class="d">${c[1]}</div></div>`,laneB));
  [0,1,2,3].forEach(i=>add(`<div id="bar${i}" class="abs" style="left:${96+2*330+160+i*30}px;top:${860-30-[24,40,30,50][i]}px;width:20px;height:${[24,40,30,50][i]}px;background:var(--acc);border-radius:4px;transform-origin:50% 100%"></div>`,laneB));
  add('<div id="bstrip" class="abs" style="left:96px;top:890px;width:1280px;font-size:28px;font-weight:600;color:var(--mut);line-height:36px;white-space:nowrap">Preço da vigência · bônus · recibo por e-mail</div>',laneB);
  const tokB=add('<div class="dot" id="tokB" style="left:0;top:0"></div>',laneB);

  // Merge column
  const mg=add('<div id="mg"></div>');
  add('<div id="mgc" class="card big" style="left:900px;top:330px;width:924px;height:590px;border-color:var(--acc);background:rgba(52,211,153,.10);padding:30px 36px"><div class="lbl" style="font-size:30px">DESTINO</div><div class="t" style="font-size:64px!important;line-height:72px!important;margin-top:12px">Reciclagem</div><div class="d" style="margin-top:16px;font-size:34px!important;line-height:42px!important">destino comum aos dois caminhos</div><div class="d" style="margin-top:22px;color:#fff;font-weight:700;font-size:38px!important;line-height:46px!important">Visão consolidada do ciclo</div></div>',mg);
  add('<div id="seal" class="seal" style="left:1380px;top:800px;font-size:40px;line-height:48px;padding:14px 28px">Visão de produto</div>',mg);
  add('<div id="mnote" class="abs" style="left:96px;top:960px;width:1700px;font-size:30px;font-weight:600;color:var(--mut);line-height:38px;white-space:nowrap">Um ciclo, uma marca, dois caminhos de registro.</div>',mg);
  const c1=sv('path',{d:'M531 458 C700 458 700 540 900 540',fill:'none',stroke:'#34d399','stroke-width':5});
  const c2=sv('path',{d:'M531 785 C700 785 700 700 900 700',fill:'none',stroke:'#34d399','stroke-width':5});

  // Beat 6 — value + clients
  const b6=add('<div id="beat6"></div>');
  [['Rastreabilidade','de quem gera até quem destina'],['Comprovante por etapa','CDF ou recibo, em cada caminho'],['Operação multi-cliente','uma marca para vários clientes']].forEach((v,i)=>add(`<div id="v${i}" class="card" style="left:${96+i*586}px;top:320px;width:556px;height:270px;border-color:rgba(52,211,153,.5)"><div class="t" style="color:var(--acc);font-size:44px;line-height:52px">${v[0]}</div><div class="d" style="font-size:34px;line-height:42px;margin-top:14px">${v[1]}</div></div>`,b6));
  add('<div id="cl" class="abs lbl" style="left:96px;top:650px;font-size:34px">CLIENTES</div>',b6);
  [['light.png',96,150],['neoenergia.png',612,300],['ecoenel.png',1128,300]].forEach((l,i)=>add(`<div id="lg${i}" class="logo" style="left:${l[1]}px;top:710px;width:476px;height:238px"><img src="./assets/brands/${l[0]}" alt=""></div>`,b6));

  // ---------- timeline ----------
  const g=gsap, tl=g.timeline({paused:true});
  const all=(s)=>g.utils.toArray(s);
  g.set(['#heads > div','#beat1','#beat2','#laneA','#opt','#laneB','#mg','#beat6'],{opacity:0});
  g.set(optAll,{opacity:0});
  g.set(['#beat1 > *','#beat2 > *','#laneA > *','#laneB > *','#mg > *','#beat6 > *'],{opacity:0});
  g.set(['#beat1','#beat2','#laneA','#laneB','#mg','#beat6'],{opacity:1});
  g.set([l1,l2,c1,c2],{opacity:0});
  const len1=l1.getTotalLength(), pl=c1.getTotalLength();
  g.set([c1,c2],{strokeDasharray:pl,strokeDashoffset:pl});
  g.set('#tokA,#tokB',{opacity:0});
  g.set('#laneA',{scale:1.35,transformOrigin:'96px 258px'});
  g.set('#laneB',{scale:1.35,y:-180,transformOrigin:'96px 610px'});

  const out=(sel,t,d=0.35)=>tl.to(sel,{opacity:0,duration:d,ease:'power1.in'},t);
  const inn=(sel,t,d=0.5,y=22)=>tl.fromTo(sel,{opacity:0,y},{opacity:1,y:0,duration:d,ease:'power2.out'},t);
  const head=(i,t)=>inn(hel[i],t,0.5,14);

  // Beat 1  0–3.6
  head(0,0.15);
  inn('#p1a',0.5);inn('#p1b',0.7);inn('#p2a',1.0);
  tl.to([l1,l2],{opacity:.8,duration:.4},1.0);
  dots.forEach((d,i)=>{tl.fromTo(d,{opacity:0,x:0},{opacity:1,x:0,duration:.2},1.3+i*.25).to(d,{x:250+i*30,duration:1.0,ease:'none'},1.3+i*.25).to(d,{opacity:0,duration:.3},2.2+i*.25)});
  tl.fromTo('#q',{opacity:0,scale:.6},{opacity:1,scale:1,duration:.4,ease:'back.out(2)'},2.3);
  tl.fromTo('#d20',{opacity:0,x:0},{opacity:1,duration:.2},1.6).to('#d20',{x:260,duration:.9,ease:'none'},1.6).to('#d20',{opacity:0,duration:.3},2.5);
  inn('#nr',2.6,.4,10);
  out(['#h0','#beat1'],3.25,.35);

  // Beat 2  3.6–7.2
  head(1,3.6);
  roles.forEach((r,i)=>inn('#r'+i,3.9+i*.22,.45));
  inn('#ga',5.2,.4,10);inn('#gb',5.4,.4,10);
  tl.fromTo(['#gaL','#gbL'],{opacity:0,scaleX:0,transformOrigin:'0 50%'},{opacity:1,scaleX:1,duration:.6,ease:'power2.out'},5.3);
  tl.to(['#r0','#r1','#r2'],{borderColor:'#34d399',duration:.3},5.9);
  tl.to(['#r3','#r4','#r5'],{borderColor:'#34d399',backgroundColor:'rgba(52,211,153,.10)',duration:.3},6.2);
  out(['#h1','#beat2'],6.85,.35);

  // Beat 3  7.2–12.6
  head(2,7.2);
  inn('#la',7.4,.4,10);
  A.forEach((c,i)=>inn('#a'+i,7.5+i*.2,.4));
  inn(['#stl','#s0','#s1','#s2'],8.2,.4,10);
  const actv=(id,t)=>tl.to(id,{borderColor:'#34d399',backgroundColor:'rgba(52,211,153,.16)',duration:.25},t);
  const pact=(id,t)=>tl.to(id,{borderColor:'#34d399',backgroundColor:'rgba(52,211,153,.9)',color:'#0a1a14',duration:.25},t);
  tl.set('#tokA',{x:96+30,y:310+190-24,opacity:0},8.0);
  tl.to('#tokA',{opacity:1,duration:.25},8.4);
  actv('#a0',8.5);pact('#s0',8.5);
  tl.to('#tokA',{x:aX(1)+30,duration:.7,ease:'power2.inOut'},9.2);actv('#a1',9.7);
  tl.to('#tokA',{x:aX(2)+30,duration:.7,ease:'power2.inOut'},10.1);actv('#a2',10.6);
  tl.to('#s0',{backgroundColor:'rgba(0,0,0,0)',color:'#a9c7ba',duration:.2},10.6);pact('#s1',10.6);
  tl.to('#tokA',{x:aX(3)+30,duration:.7,ease:'power2.inOut'},11.3);actv('#a3',11.8);
  tl.to('#s1',{backgroundColor:'rgba(0,0,0,0)',color:'#a9c7ba',duration:.2},11.8);pact('#s2',11.8);
  // Optional panel 9.4–12.4 (below lane A, where lane B will later appear)
  optAll.forEach((e,i)=>{ if(e.id==='no') return; tl.fromTo(e,{opacity:0,y:14},{opacity:1,y:0,duration:.4},9.6+i*.15)});
  tl.fromTo('#no',{opacity:0,y:14},{opacity:1,y:0,duration:.4},10.6);
  out(['#h2'],12.35,.3);
  out([...optAll],12.4,.3);
  out(['#st','#stl','#s0','#s1','#s2','#tokA'],12.4,.3);

  // Beat 4  12.6–16.8 (lane A stays, dimmed; first cards slide up)
  tl.to(['#a0','#a1','#a2','#a3','#la'],{opacity:0,duration:.4},12.3);
  tl.to('#laneA',{scale:1,duration:.6,ease:'power2.inOut'},12.4);
  head(3,12.6);
  B.forEach((c,i)=>inn('#b'+i,13.0+i*.2,.4));
  tl.fromTo('#laneB > .lbl',{opacity:0},{opacity:1,duration:.3},12.9);
  tl.set('#tokB',{x:96+30,y:660+200-24},13.0);
  tl.to('#tokB',{opacity:1,duration:.25},13.4);actv('#b0',13.5);
  tl.to('#tokB',{x:aX(1)+30,duration:.6,ease:'power2.inOut'},14.0);actv('#b1',14.5);
  tl.to('#tokB',{x:aX(2)+30,duration:.6,ease:'power2.inOut'},14.9);actv('#b2',15.4);
  [0,1,2,3].forEach(i=>tl.fromTo('#bar'+i,{opacity:0,scaleY:0},{opacity:1,scaleY:1,duration:.45,ease:'power2.out'},15.0+i*.12));
  tl.to('#tokB',{x:aX(3)+30,duration:.6,ease:'power2.inOut'},15.8);actv('#b3',16.3);
  inn('#bstrip',15.7,.4,10);
  tl.to('#tokB',{opacity:0,duration:.2},16.4);
  tl.to('#laneB',{scale:1,y:0,duration:.6,ease:'power2.inOut'},16.55);
  out('#h3',16.6,.3);

  // Beat 5  16.8–20.2
  tl.to(['#a0','#a1','#a2','#b0','#b1','#b2','#la','#laneB > .lbl','#bar0','#bar1','#bar2','#bar3'],{opacity:0,duration:.4},16.75);
  tl.to('#a3',{opacity:1,x:-946,y:20,scale:1.35,transformOrigin:'0 0',duration:.7,ease:'power2.inOut'},16.8);
  tl.to('#b3',{opacity:1,x:-946,y:-10,scale:1.35,transformOrigin:'0 0',duration:.7,ease:'power2.inOut'},16.8);
  tl.to(['#bstrip'],{opacity:0,duration:.3},16.7);
  head(4,16.85);
  inn('#mgc',17.1,.5);
  tl.set([c1,c2],{opacity:1},17.7);
  tl.to(c1,{strokeDashoffset:0,duration:.7,ease:'power2.inOut'},17.7);
  tl.to(c2,{strokeDashoffset:0,duration:.7,ease:'power2.inOut'},17.9);
  tl.fromTo('#seal',{opacity:0,scale:2.2,rotation:-14,transformOrigin:'50% 50%'},{opacity:1,scale:1,rotation:-4,duration:.5,ease:'back.out(1.6)'},18.6);
  inn('#mnote',19.0,.4,10);
  out(['#h4'],20.0,.3);

  // Beat 6  20.2–23
  out(['#laneA','#laneB','#mg','#mnote',c1,c2],20.0,.4);
  tl.set(ovl,{opacity:1},0);
  head(5,20.3);
  [0,1,2].forEach(i=>inn('#v'+i,20.6+i*.2,.45));
  inn('#cl',21.3,.4,10);
  [0,1,2].forEach(i=>inn('#lg'+i,21.5+i*.15,.45));
    // Visibility windows so hidden scenes are truly absent (not just transparent)
  const win=(sel,on,off)=>{g.set(sel,{visibility:'hidden'});tl.set(sel,{visibility:'visible'},on);tl.set(sel,{visibility:'hidden'},off)};
  win('#beat1',0,3.7);win('#beat2',3.5,7.3);win('#laneA',7.3,20.5);win('#laneB',12.5,20.5);win('#mg',17.0,20.5);win('#beat6',20.2,23);
  optAll.forEach(e=>win(e,9.5,12.8));
  hel.forEach((e,i)=>win(e,[0,3.55,7.15,12.55,16.8,20.2][i],[3.7,7.3,12.7,16.95,20.4,23][i]));
  win([c1,c2],17.6,20.5);win([l1,l2],0,3.7);
  tl.set({}, {}, 23);

  window.__timelines=window.__timelines||{};
