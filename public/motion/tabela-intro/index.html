<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Tabe.la · Abertura</title>
<style>
/* BASE DA ABERTURA */
@font-face{font-family:Inter;src:url("./assets/fonts/Inter-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:#6E70BF}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#6E70BF;font-family:Inter,sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
#line{position:absolute;left:0;top:760px;width:1920px;text-align:center;font-size:48px;font-weight:600;letter-spacing:-.015em;line-height:1.2;opacity:0;text-shadow:0 2px 18px rgba(30,32,90,.28)}
</style>
</head>
<body>
<div id="root" data-composition-id="tabela-intro" data-width="1920" data-height="1080" data-duration="8.5">
  <canvas id="stage" width="1920" height="1080" aria-hidden="true"></canvas>
  <div id="line">Comercialização imobiliária, da tabela à decisão</div>
</div>
<script src="./assets/js/gsap.min.js"></script>
<script src="./assets/js/shaders.js"></script>
<script src="./assets/js/logo-data.js"></script>
<script src="./assets/js/choreography.js"></script>
<script>
// RENDER DETERMINÍSTICO DA ABERTURA (WebGL2 dirigido pela timeline, sem relógio próprio)
(function () {
  var W = 1920, H = 1080, DURATION = 8.5;
  // Scene runs at 1/SLOW of the login speed (calm pace); LEAD is a bare-grid beat before the crane enters
  var SLOW = 1.7, LEAD = 0.3;
  // Visual scale versus the login panel (logo 340 css px there, 760 px here); also scales stroke widths
  var LOGO_W = 760, SCALE = LOGO_W / 340;
  var HERO = [110 / 255, 112 / 255, 191 / 255]; // --brand-hero = oklch(0.58 ...) of series-indigo-200, resolved to sRGB
  var VB = { w: 218, h: 61 };
  var LOGO_H = LOGO_W * VB.h / VB.w;
  var logoRect = [(W - LOGO_W) / 2, (H - LOGO_H) / 2 + 40, LOGO_W, LOGO_H];
  var layout = { width: W, height: H, dpr: SCALE, logo: logoRect, dot: LOGO_DOT, bounds: LOGO_BOUNDS };
  var TEX_W = 1140, lod0 = Math.log2(TEX_W / LOGO_W);

  var canvas = document.getElementById('stage');
  var gl = canvas.getContext('webgl2', { premultipliedAlpha: true, antialias: true, alpha: false, preserveDrawingBuffer: true });
  var programs = {}, textures = {}, loaded = 0, quadVao = null, curT = 0;

  function compile(fs) {
    var program = gl.createProgram();
    [[gl.VERTEX_SHADER, VS_QUAD], [gl.FRAGMENT_SHADER, fs]].forEach(function (s) {
      var sh = gl.createShader(s[0]); gl.shaderSource(sh, s[1]); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
      gl.attachShader(program, sh); gl.deleteShader(sh);
    });
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
    var uniforms = {}, n = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
    for (var i = 0; i < n; i++) { var info = gl.getActiveUniform(program, i); if (info) uniforms[info.name] = gl.getUniformLocation(program, info.name); }
    return { program: program, uniforms: uniforms };
  }
  function setU(p, extra, base) {
    gl.useProgram(p.program);
    var all = Object.assign({}, base, extra);
    Object.keys(all).forEach(function (name) {
      var loc = p.uniforms[name]; if (!loc) return; var v = all[name];
      if (v.length === 1) gl.uniform1f(loc, v[0]); else if (v.length === 2) gl.uniform2f(loc, v[0], v[1]);
      else if (v.length === 3) gl.uniform3f(loc, v[0], v[1], v[2]); else gl.uniform4f(loc, v[0], v[1], v[2], v[3]);
    });
    if (p.uniforms.uPart) gl.uniform1i(p.uniforms.uPart, 3);
  }
  function draw(p, extra, base) { setU(p, extra, base); gl.bindVertexArray(quadVao); gl.drawArrays(gl.TRIANGLES, 0, 3); }

  // Deterministic stand-in for Math.random (drill vibration): a pure hash of the time and call index
  function makeJitter(t) { var n = 0; return function () { var x = Math.sin(t * 1000.7 + (n++) * 12.9898) * 43758.5453; return x - Math.floor(x); }; }

  function render(t) {
    curT = t;
    if (!gl || loaded < PART_IDS.length) return;
    var st = Math.max(0, (t - LEAD) / SLOW);              // scene time, login seconds
    st = Math.min(st, introTimeline().dur);
    // Scripted stand-in for the pointer that lights the grid in the login (no real pointer in a film)
    var mouse = [W * (0.5 + 0.34 * Math.sin(t * 0.42)), H * (0.5 + 0.3 * Math.sin(t * 0.29 + 1.0))];
    var base = { uRes: [W, H], uRect: logoRect, uLod0: [lod0], uMouse: mouse, uHero: HERO, uDpr: [SCALE] };
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
    gl.disable(gl.BLEND);
    draw(programs.bg, { uBgT: [t] }, base);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    var pose = sceneAt(st, layout, makeJitter(st));
    pose.pieces.forEach(function (pc) {
      gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, textures[pc.id]); gl.activeTexture(gl.TEXTURE0);
      draw(programs.piece, { uXf: [pc.dx, pc.dy, pc.angle, pc.alpha], uPivot: pc.pivot }, base);
    });
    draw(programs.crane, { uCrane: pose.crane }, base);
    draw(programs.drill, { uDot: pose.dot, uDrill: pose.drill, uScrew: pose.screw, uFx: pose.fx }, base);
  }

  function init() {
    programs = { bg: compile(FS_BG), crane: compile(FS_CRANE), piece: compile(FS_PIECE), drill: compile(FS_DRILL) };
    quadVao = gl.createVertexArray(); gl.bindVertexArray(quadVao);
    var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0); gl.bindVertexArray(null);
    PART_IDS.forEach(function (id) {
      var img = new Image();
      img.onload = function () {
        var tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img); gl.generateMipmap(gl.TEXTURE_2D);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        textures[id] = tex; loaded++;
        if (loaded === PART_IDS.length) render(curT);
      };
      img.src = './assets/parts/' + id + '.png';
    });
  }
  init();

  // TIMELINE (a única fonte de tempo): um tween linear sobre um proxy dirige o render; a frase entra por cima como os slogans do login
  var proxy = { t: 0 };
  var tl = gsap.timeline({ paused: true });
  tl.to(proxy, { t: DURATION, duration: DURATION, ease: 'none', onUpdate: function () { render(proxy.t); } }, 0);
  var seatAt = LEAD + introTimeline().seat * SLOW;      // dot seated -> line enters (as slogans start at seat in the login)
  tl.fromTo('#line', { opacity: 0, y: -26 }, { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, seatAt + 0.1);
  window.__timelines = window.__timelines || {};
  window.__timelines['tabela-intro'] = tl;
})();
</script>
</body>
</html>
