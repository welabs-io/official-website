<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>SignGo · documento e assinadores</title>
    <link rel="stylesheet" href="assets/shared/product-motion-kit.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div data-hf-id="hf-5wyx" id="root" data-composition-id="signgo-preparation" data-width="1920" data-height="1080" data-duration="12">
      <main data-hf-id="hf-scna" id="product-stage" class="product-stage"></main>
    </div>
    <script src="assets/shared/gsap.min.js"></script>
    <script type="module">
      import { buildComposition } from "./build.js";
      window.__timelines = window.__timelines || {};
      const completed = await buildComposition();
      window.__timelines["signgo-preparation"] = completed.timeline;
      window.__hfForceTimelineRebind?.();
    </script>
  <script type="module">const id="signgo-preparation",d=12;const pad=()=>{const t=window.__timelines||{};for(const tl of [t[id],...Object.values(t)]){if(tl&&tl.duration&&tl.duration()<d){tl.to({},{duration:d-tl.duration()},tl.duration());}}};pad();let n=0;const tick=()=>{pad();if(++n<40)setTimeout(tick,50);};tick();</script>
</body>
</html>
