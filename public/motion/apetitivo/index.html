      import { buildComposition } from "./build.js";

      const completed = await buildComposition();

      window.__hfForceTimelineRebind?.();

  <script type="module">const id="apetitivo-historical-menu",d=12;const pad=()=>{const t=window.__timelines||{};for(const tl of [t[id],...Object.values(t)]){if(tl&&tl.duration&&tl.duration()<d){tl.to({},{duration:d-tl.duration()},tl.duration());}}};pad();let n=0;const tick=()=>{pad();if(++n<40)setTimeout(tick,50);};tick();</script>
