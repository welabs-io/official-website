<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>ERP Construtor</title>
<style>
  /* TIPOGRAFIA E TOKENS */
  @font-face { font-family: "Inter"; src: url("./assets/fonts/Inter-latin.woff2") format("woff2"); font-weight: 100 900; }
  :root { --bg: #0B0B0D; --panel: #17171B; --line: #3A3A42; --coral: #FF452B; --text: #FFFFFF; --muted: #C9C9D1; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); width: 1920px; height: 1080px; margin: 0; overflow: hidden; }
  #root { position: relative; width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font-family: "Inter", sans-serif; }

  /* CABECALHO, SELO PERMANENTE E LEGENDA */
  #title { position: absolute; left: 60px; top: 36px; font-size: 60px; font-weight: 800; letter-spacing: -1px; }
  #title span { color: var(--coral); }
  #logo { position: absolute; right: 60px; top: 34px; height: 64px; width: auto; }
  #seal { position: absolute; left: 640px; top: 40px; height: 56px; padding: 0 26px; display: flex; align-items: center; border-radius: 999px; border: 4px dashed var(--coral); background: #2A110C; color: #fff; font-size: 30px; font-weight: 800; }
  #legend { position: absolute; left: 60px; top: 116px; display: flex; gap: 40px; font-size: 26px; color: var(--muted); font-weight: 600; }
  #legend i { display: inline-block; width: 56px; height: 0; vertical-align: middle; margin-right: 12px; }
  #legend .ex { border-top: 4px solid #fff; }
  #legend .pl { border-top: 4px dashed var(--coral); }
  .grp { position: absolute; left: 60px; top: 186px; width: 400px; font-size: 26px; font-weight: 800; color: var(--muted); opacity: 0; }

  /* NOS */
  .node { position: absolute; display: flex; flex-direction: column; justify-content: center; padding: 14px 22px; border: 3px solid var(--line); border-radius: 18px; background: var(--panel); opacity: 0; }
  .node b { font-size: 32px; font-weight: 800; line-height: 1.15; }
  .node em { font-style: normal; font-size: 24px; font-weight: 500; line-height: 1.2; color: var(--muted); margin-top: 6px; }
  .node.hero b { font-size: 46px; }
  .node.hero em { font-size: 26px; }
  .node.planned { border-style: dashed; border-color: #8A3A2E; background: #1D1210; }

  /* ARESTAS */
  svg#edges { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .edge { fill: none; stroke: #fff; stroke-width: 4; opacity: 0; }
  .edge.pl { stroke: var(--coral); stroke-dasharray: 14 10; }
  .lbl { position: absolute; font-size: 24px; font-weight: 700; color: var(--muted); white-space: nowrap; opacity: 0; background: var(--bg); padding: 0 10px; }

  /* LEGENDA DA BATIDA */
  #captions { position: absolute; left: 60px; right: 60px; top: 955px; height: 90px; }
  .cap { position: absolute; left: 0; right: 0; top: 0; height: 90px; display: flex; align-items: center; gap: 22px; padding: 0 28px; border-radius: 16px; background: #1A1A1F; border-left: 8px solid var(--coral); font-size: 30px; font-weight: 600; opacity: 0; }
  .cap small { font-size: 24px; font-weight: 800; color: var(--coral); }
  #pad { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="erp-builder" data-width="1920" data-height="1080" data-start="0" data-duration="20">
  <div id="title">ERP · <span>Construtor</span></div>
  <div id="seal">Previsto · em planejamento</div>
  <img id="logo" src="./assets/welabs-logo.png" alt="Welabs">
  <div id="legend"><div><i class="ex"></i>Existe hoje</div><div><i class="pl"></i>Previsto</div></div>
  <div class="grp" id="grp">O ERP já sabe</div>
  <div id="stage">
  <svg id="edges" viewBox="0 0 1920 1080">
    <defs>
      <marker id="arW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fff"/></marker>
      <marker id="arC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FF452B"/></marker>
    </defs>
  </svg>
  </div>
  <div id="captions"></div>
  <div id="pad"></div>
</div>
<script src="./assets/shared/gsap.min.js"></script>
<script>
  // CONSTRUCAO DO GRAFO (posicoes fixas, sem aleatoriedade)
  var N = {
    dt:    { x: 260,  y: 335, w: 400, h: 150, t: "DocTypes e dados", s: "entidades, campos e registros" },
    cap:   { x: 260,  y: 545, w: 400, h: 150, t: "Capacidades", s: "o que cada tela pode fazer" },
    flw:   { x: 260,  y: 755, w: 400, h: 150, t: "Fluxos", s: "definições publicadas pelo ERP" },
    need:  { x: 920,  y: 300, w: 400, h: 130, t: "Uma necessidade", s: "de negócio", cls: "planned" },
    build: { x: 920,  y: 560, w: 440, h: 210, t: "Construtor", s: "compõe a partir do que o ERP já sabe", cls: "hero planned" },
    out:   { x: 1560, y: 400, w: 400, h: 150, t: "Tela ou produto", s: "sem escrever à mão", cls: "planned" },
    run:   { x: 1560, y: 755, w: 400, h: 150, t: "Plataforma", s: "Flow e demais · sandbox" }
  };
  var root = document.getElementById("stage"), svg = document.getElementById("edges");
  Object.keys(N).forEach(function (k) {
    var n = N[k], d = document.createElement("div");
    d.className = "node " + (n.cls || ""); d.id = "n-" + k;
    d.style.left = (n.x - n.w / 2) + "px"; d.style.top = (n.y - n.h / 2) + "px"; d.style.width = n.w + "px"; d.style.height = n.h + "px";
    d.innerHTML = "<b>" + n.t + "</b><em>" + n.s + "</em>";
    root.appendChild(d);
  });
  // Point where the ray from rect center toward target leaves the rect, plus a gap
  function edgePt(a, b, gap) {
    var dx = b.x - a.x, dy = b.y - a.y, sx = (a.w / 2 + gap) / Math.abs(dx || 1e-9), sy = (a.h / 2 + gap) / Math.abs(dy || 1e-9), s = Math.min(sx, sy);
    return { x: a.x + dx * s, y: a.y + dy * s };
  }
  var NS = "http://www.w3.org/2000/svg";
  function edge(id, from, to, planned) {
    var p1 = edgePt(N[from], N[to], 8), p2 = edgePt(N[to], N[from], 8);
    var l = document.createElementNS(NS, "line");
    l.setAttribute("x1", p1.x); l.setAttribute("y1", p1.y); l.setAttribute("x2", p2.x); l.setAttribute("y2", p2.y);
    l.setAttribute("class", "edge" + (planned ? " pl" : "")); l.setAttribute("id", id);
    l.setAttribute("marker-end", planned ? "url(#arC)" : "url(#arW)");
    if (!planned) { l.setAttribute("pathLength", "1"); l.style.strokeDasharray = "1"; l.style.strokeDashoffset = "1"; }
    svg.appendChild(l);
    return { mx: (p1.x + p2.x) / 2, my: (p1.y + p2.y) / 2 };
  }
  edge("e-dt", "dt", "build", true);
  edge("e-cap", "cap", "build", true);
  edge("e-flw", "flw", "build", true);
  edge("e-need", "need", "build", true);
  edge("e-out", "build", "out", true);
  edge("e-run", "out", "run", true);
  // Existing edge: ERP flow definitions reach the platform today
  var mPub = edge("e-pub", "flw", "run", false);
  var lbl = document.createElement("div"); lbl.className = "lbl"; lbl.id = "l-pub"; lbl.textContent = "publica (existe hoje)";
  root.appendChild(lbl); lbl.style.left = "910px"; lbl.style.top = (mPub.my + 40) + "px"; lbl.style.transform = "translate(-50%,-50%)";

  // LEGENDAS DAS BATIDAS
  var caps = [
    "Hoje o ERP é dono dos dados e das definições; o Construtor ainda não existe",
    "Uma necessidade de negócio chega ao Construtor, que é previsto",
    "Ele compõe a partir do que o ERP já conhece: dados, capacidades e fluxos",
    "O resultado é uma tela ou produto, sem escrever tudo à mão",
    "E roda na plataforma (Flow e demais, hoje em sandbox); tracejado é previsto"
  ];
  var capBox = document.getElementById("captions");
  caps.forEach(function (t, i) {
    var d = document.createElement("div"); d.className = "cap"; d.id = "cap" + i;
    d.innerHTML = "<small>" + (i + 1) + "/5</small><span>" + t + "</span>"; capBox.appendChild(d);
  });

  // LINHA DO TEMPO (pausada, termina em 20 s)
  var tl = gsap.timeline({ paused: true });
  var LIT = { borderColor: "#FF452B", boxShadow: "0 0 0 6px rgba(255,69,43,0.22)", duration: 0.5 };
  function appear(id, t) { tl.fromTo("#n-" + id, { opacity: 0, y: 24, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, t); }
  function lit(id, t) { tl.to("#n-" + id, LIT, t); }
  function dim(id, t, c) { tl.to("#n-" + id, { borderColor: c || "#5A5A66", boxShadow: "0 0 0 0px rgba(255,69,43,0)", duration: 0.5 }, t); }
  function draw(id, t, d) { tl.to("#" + id, { opacity: 1, strokeDashoffset: 0, duration: d || 0.9, ease: "power2.inOut" }, t); }
  function show(id, t) { tl.to("#" + id, { opacity: 1, duration: 0.7, ease: "power2.out" }, t); }
  function cap(i, a, b) {
    tl.fromTo("#cap" + i, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, a);
    if (b) tl.to("#cap" + i, { opacity: 0, duration: 0.4 }, b - 0.4);
  }
  tl.fromTo("#title", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.7 }, 0);
  tl.fromTo("#legend", { opacity: 0 }, { opacity: 1, duration: 0.7 }, 0.3);

  // Beat 1: what exists today
  cap(0, 0.6, 5); tl.to("#grp", { opacity: 1, duration: 0.6 }, 0.8);
  appear("dt", 1.0); appear("cap", 1.6); appear("flw", 2.2);
  appear("run", 3.0); draw("e-pub", 3.6, 1.0); show("l-pub", 4.4);
  lit("dt", 1.0); lit("cap", 1.6); lit("flw", 2.2); dim("dt", 4.6, "#FFFFFF"); dim("cap", 4.6, "#FFFFFF"); dim("flw", 4.6, "#FFFFFF");
  dim("run", 4.6, "#FFFFFF");

  // Beat 2: need reaches the builder
  cap(1, 5, 9.5); appear("need", 5.4); lit("need", 5.4); appear("build", 6.4); lit("build", 6.4);
  draw("e-need", 7.2, 0.9);

  // Beat 3: builder composes from what the ERP knows
  cap(2, 9.5, 13.5); dim("need", 9.6, "#8A3A2E");
  draw("e-dt", 10.0, 0.9); draw("e-cap", 10.5, 0.9); draw("e-flw", 11.0, 0.9);
  tl.fromTo("#n-build", { scale: 1 }, { scale: 1.04, duration: 0.7, yoyo: true, repeat: 1, ease: "sine.inOut" }, 11.8);

  // Beat 4: becomes screen or product
  cap(3, 13.5, 16.5); appear("out", 14.0); lit("out", 14.0); draw("e-out", 14.4, 0.9);

  // Beat 5: runs on the platform
  cap(4, 16.5); dim("out", 16.6, "#8A3A2E"); dim("build", 16.6, "#8A3A2E");
  draw("e-run", 17.0, 0.9); lit("run", 17.6);
  // Final hold: pad to exactly 20 s
  tl.fromTo("#pad", { opacity: 0 }, { opacity: 0.001, duration: 1 }, 19);

  window.__timelines = window.__timelines || {};
  window.__timelines["erp-builder"] = tl;
</script>
</body>
</html>
