<!DOCTYPE html>

        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        box-sizing: border-box;
      }
      #product-stage {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        box-sizing: border-box;
      }
    </style>

  <body>
    <div data-hf-id="hf-ydj6" id="root" data-composition-id="wekb-demo-trace" data-width="1920" data-height="1080" data-duration="13.4">
      <main data-hf-id="hf-scna" id="product-stage" class="product-stage"></main>
    </div>
    <script src="assets/shared/gsap.min.js"></script>
    <script type="module">
      import { buildComposition } from "./build.js";
      window.__timelines = window.__timelines || {};
      const completed = await buildComposition();
      window.__timelines["wekb-demo-trace"] = completed.timeline;
      window.__hfForceTimelineRebind?.();
    </script>
  <script type="module">const id="wekb-demo-trace",d=13.4;const pad=()=>{const t=window.__timelines||{};for(const tl of [t[id],...Object.values(t)]){if(tl&&tl.duration&&tl.duration()<d){tl.to({},{duration:d-tl.duration()},tl.duration());}}};pad();let n=0;const tick=()=>{pad();if(++n<40)setTimeout(tick,50);};tick();</script>
