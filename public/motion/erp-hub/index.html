<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>ERP · o centro do domínio</title>
<style>
  /* TIPOGRAFIA E TOKENS */
  @font-face { font-family: "Inter"; src: url("./assets/fonts/Inter-latin.woff2") format("woff2"); font-weight: 100 900; }
  :root { --bg: #0B0B0D; --panel: #17171B; --line: #3A3A42; --coral: #FF452B; --text: #FFFFFF; --muted: #C9C9D1; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); width: 1920px; height: 1080px; margin: 0; overflow: hidden; }
  #root { position: relative; width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font-family: "Inter", sans-serif; }

  /* CABECALHO, SELO E LEGENDA */
  #title { position: absolute; left: 60px; top: 36px; font-size: 60px; font-weight: 800; letter-spacing: -1px; white-space: nowrap; z-index: 5; }
  #title span { color: var(--coral); }
  #seal { position: absolute; right: 60px; top: 34px; height: 64px; width: auto; z-index: 5; }
  #legend { position: absolute; left: 1060px; top: 52px; display: flex; gap: 36px; font-size: 26px; color: var(--muted); font-weight: 600; z-index: 5; white-space: nowrap; }
  #legend i { display: inline-block; width: 56px; height: 0; vertical-align: middle; margin-right: 12px; }
  #legend .ex { border-top: 4px solid #fff; }
  #legend .pl { border-top: 4px dashed var(--coral); }

  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }

  /* NOS DO GRAFO */
  .node { position: absolute; display: flex; flex-direction: column; justify-content: center; padding: 10px 22px; border: 3px solid #5A5A66; border-radius: 18px; background: var(--panel); opacity: 0; }
  .node b { font-size: 30px; font-weight: 800; line-height: 1.15; }
  .node em { font-style: normal; font-size: 24px; font-weight: 500; line-height: 1.2; color: var(--muted); margin-top: 4px; white-space: nowrap; }
  .node.chip { padding: 0 22px; border-radius: 14px; background: #1D1713; }
  .node.chip b { font-size: 30px; }
  .node.hub { align-items: center; text-align: center; background: #1D1713; border-color: var(--coral); border-width: 4px; border-radius: 26px; }
  .node.hub b { font-size: 78px; letter-spacing: -2px; line-height: 1; }
  .node.hub em { font-size: 28px; color: #fff; font-weight: 600; margin-top: 8px; }
  .node.hub small { font-size: 24px; color: var(--muted); font-weight: 600; margin-top: 4px; }
  .node.planned { border-style: dashed; }
  .tag { position: absolute; right: 14px; top: -22px; padding: 2px 14px; border-radius: 999px; background: var(--coral); color: #fff; font-size: 24px; font-weight: 800; opacity: 0; }
  .node.builder { align-items: center; text-align: center; background: #1D1713; border-color: var(--coral); }
  .node.builder b { font-size: 44px; }
  .node.builder em { font-size: 26px; color: #fff; }

  /* ARESTAS E ROTULOS */
  svg#edges { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .edge { fill: none; stroke: #fff; stroke-width: 4; opacity: 0; }
  .edge.pl { stroke: var(--coral); stroke-dasharray: 14 10; }
  .pill { position: absolute; padding: 2px 14px; border-radius: 999px; background: var(--bg); border: 3px solid var(--coral); color: var(--coral); font-size: 24px; font-weight: 800; white-space: nowrap; opacity: 0; }

  /* LEGENDA DA BATIDA */
  #captions { position: absolute; left: 60px; right: 60px; top: 955px; height: 90px; z-index: 5; }
  .cap { position: absolute; left: 0; right: 0; top: 0; height: 90px; display: flex; align-items: center; gap: 22px; padding: 0 28px; border-radius: 16px; background: #1A1A1F; border-left: 8px solid var(--coral); font-size: 34px; font-weight: 700; line-height: 1.15; opacity: 0; white-space: nowrap; }
  .cap small { font-size: 24px; font-weight: 800; color: var(--coral); }

  /* FECHAMENTO */
  #close { position: absolute; left: 120px; right: 120px; top: 250px; height: 580px; z-index: 6; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border-radius: 32px; background: rgba(11,11,13,0.9); border: 3px solid var(--coral); opacity: 0; }
  #close div { font-size: 100px; font-weight: 800; letter-spacing: -2px; line-height: 1.15; opacity: 0; white-space: nowrap; }
  #close div.c { color: var(--coral); }
  #close p { margin-top: 26px; font-size: 30px; font-weight: 600; color: var(--muted); opacity: 0; }
  #pad { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="erp-hub" data-width="1920" data-height="1080" data-start="0" data-duration="23">
  <div id="title">ERP · <span>o centro do domínio</span></div>
  <div id="legend"><div><i class="ex"></i>Existente</div><div><i class="pl"></i>Previsto</div></div>
  <img id="seal" src="./assets/welabs-logo.png" alt="Welabs">
  <div id="stage">
    <svg id="edges" viewBox="0 0 1920 1080">
      <defs>
        <marker id="arW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fff"/></marker>
        <marker id="arC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FF452B"/></marker>
      </defs>
    </svg>
  </div>
  <div id="captions"></div>
  <div id="close">
    <div>Um centro de domínio.</div>
    <div>Qualquer módulo.</div>
    <div class="c">Tudo conectado.</div>
    <p>Hoje em sandbox: ERP, Flow e contratos · Previsto: Construtor, MCP e demais conexões</p>
  </div>
  <div id="pad"></div>
</div>
<script src="./assets/shared/gsap.min.js"></script>
<script>
  // CONSTRUCAO DO GRAFO (posicoes fixas, sem aleatoriedade)
  var SW = 400, SH = 110;
  var N = {
    erp:  { x: 960, y: 330, w: 460, h: 200, hub: 1 },
    // Beat 1: what the ERP holds (chips feed the hub, then fold into it)
    c1: { x: 290, y: 190, w: SW, h: 70, t: "Entidades", chip: 1 },
    c2: { x: 290, y: 330, w: SW, h: 70, t: "Regras", chip: 1 },
    c3: { x: 290, y: 470, w: SW, h: 70, t: "Permissões", chip: 1 },
    c4: { x: 1630, y: 190, w: SW, h: 70, t: "Identidades", chip: 1 },
    c5: { x: 1630, y: 330, w: SW, h: 70, t: "Definições de processo", chip: 1 },
    // Beat 2: spokes
    flow: { x: 290, y: 190, w: SW, h: SH, t: "Flow", s: "executa o que o ERP publica" },
    kb:   { x: 290, y: 330, w: SW, h: SH, t: "KB", s: "conhecimento com fonte" },
    crm:  { x: 290, y: 470, w: SW, h: SH, t: "CRM", s: "atendimento e comercial" },
    chan: { x: 1630, y: 190, w: SW, h: SH, t: "Channels", s: "camada de conversa" },
    ext:  { x: 1630, y: 330, w: SW, h: SH, t: "Sistemas externos", s: "contratos e APIs" },
    ai:   { x: 1630, y: 470, w: SW, h: SH, t: "Assistentes de IA", s: "catálogo de capacidades", planned: 1 },
    // Beat 3: builder and example modules
    bld:  { x: 960, y: 815, w: 880, h: 120, t: "Construtor", s: "dados · telas · permissões · fluxos · relatórios", builder: 1 },
    m1: { x: 420,  y: 630, w: 330, h: 80, t: "Contratos", s: "vigência e renovações", planned: 1 },
    m2: { x: 780,  y: 630, w: 330, h: 80, t: "Atendimento", s: "filas e prazos", planned: 1 },
    m3: { x: 1140, y: 630, w: 330, h: 80, t: "Estoque", s: "itens e movimentos", planned: 1 },
    m4: { x: 1500, y: 630, w: 330, h: 80, t: "Projetos", s: "etapas e entregas", planned: 1 }
  };
  var stage = document.getElementById("stage"), svg = document.getElementById("edges");
  Object.keys(N).forEach(function (k) {
    var n = N[k], d = document.createElement("div");
    d.className = "node" + (n.chip ? " chip" : "") + (n.hub ? " hub" : "") + (n.planned ? " planned" : "") + (n.builder ? " builder planned" : "");
    d.id = "n-" + k;
    d.style.left = (n.x - n.w / 2) + "px"; d.style.top = (n.y - n.h / 2) + "px"; d.style.width = n.w + "px"; d.style.height = n.h + "px";
    var h = "";
    if (n.hub) h = "<b>ERP</b><em>fonte única de verdade</em><small>sobre Frappe/ERPNext · sandbox</small>";
    else if (n.chip) h = "<b>" + n.t + "</b>";
    else h = "<b>" + n.t + "</b><em>" + n.s + "</em>";
    if (k === "ai" || k === "bld") h += '<div class="tag" id="tag-' + k + '">Previsto</div>';
    d.innerHTML = h;
    stage.appendChild(d);
  });
  // Point where the ray from rect center toward target leaves the rect, plus a gap
  function edgePt(a, b, gap) {
    var dx = b.x - a.x, dy = b.y - a.y, sx = (a.w / 2 + gap) / Math.abs(dx || 1e-9), sy = (a.h / 2 + gap) / Math.abs(dy || 1e-9), s = Math.min(sx, sy);
    return { x: a.x + dx * s, y: a.y + dy * s };
  }
  var NS = "http://www.w3.org/2000/svg";
  function line(id, p1, p2, planned, both, noDraw) {
    var l = document.createElementNS(NS, "line");
    l.setAttribute("x1", p1.x); l.setAttribute("y1", p1.y); l.setAttribute("x2", p2.x); l.setAttribute("y2", p2.y);
    l.setAttribute("class", "edge" + (planned ? " pl" : "")); l.setAttribute("id", id);
    var m = planned ? "url(#arC)" : "url(#arW)";
    l.setAttribute("marker-end", m); if (both) l.setAttribute("marker-start", m);
    if (!planned && !noDraw) { l.setAttribute("pathLength", "1"); l.style.strokeDasharray = "1"; l.style.strokeDashoffset = "1"; }
    svg.appendChild(l);
    return { mx: (p1.x + p2.x) / 2, my: (p1.y + p2.y) / 2 };
  }
  function edge(id, from, to, planned, both) { return line(id, edgePt(N[from], N[to], 8), edgePt(N[to], N[from], 8), planned, both); }
  // Beat 1 feeds: chip -> hub (solid)
  ["c1", "c2", "c3", "c4", "c5"].forEach(function (c) { edge("e-" + c, c, "erp"); });
  // Beat 2 spokes
  edge("e-flow", "flow", "erp");
  edge("e-ext", "ext", "erp", false, true);
  var mKb = edge("e-kb", "kb", "erp", true, true);
  var mCrm = edge("e-crm", "crm", "erp", true, true);
  var mChan = edge("e-chan", "chan", "erp", true, true);
  var mAi = edge("e-ai", "ai", "erp", true);
  // Beat 3: builder -> module, module -> hub (all planned)
  var hubX = [830, 910, 1010, 1090], bldX = [700, 850, 1070, 1220], mods = ["m1", "m2", "m3", "m4"];
  mods.forEach(function (m, i) {
    line("b-" + m, { x: bldX[i], y: 757 }, { x: N[m].x, y: N[m].y + 40 + 6 }, true);
    line("h-" + m, { x: N[m].x, y: N[m].y - 40 - 6 }, { x: hubX[i], y: 435 }, true);
  });
  function pill(id, text, x, y) {
    var d = document.createElement("div"); d.className = "pill"; d.id = id; d.textContent = text; stage.appendChild(d);
    d.style.left = x + "px"; d.style.top = y + "px"; d.style.transform = "translate(-50%,-50%)";
  }
  pill("p-kb", "Previsto", mKb.mx, mKb.my);
  pill("p-crm", "Previsto", mCrm.mx, mCrm.my);
  pill("p-chan", "Previsto", mChan.mx, mChan.my);
  pill("p-ai", "Previsto", mAi.mx, mAi.my);

  // LEGENDAS DAS BATIDAS
  var caps = [
    "Fonte única de verdade: entidades, regras, permissões, identidades e processos",
    "O Flow executa o que o ERP publica; sistemas externos entram por contratos",
    "KB, CRM, Channels e assistentes de IA (MCP) se conectam ao centro: Previsto",
    "Construtor (Previsto): de uma necessidade, compõe o módulo com o que o ERP já sabe",
    "Exemplos de módulos: cada um nasce plugado ao centro, com dados, telas e regras"
  ];
  var capBox = document.getElementById("captions");
  caps.forEach(function (t, i) {
    var d = document.createElement("div"); d.className = "cap"; d.id = "cap" + i;
    d.innerHTML = "<small>" + (i + 1) + "/5</small><span>" + t + "</span>"; capBox.appendChild(d);
  });

  // LINHA DO TEMPO (pausada, termina em 23 s)
  var tl = gsap.timeline({ paused: true });
  var LIT = { borderColor: "#FF452B", boxShadow: "0 0 0 6px rgba(255,69,43,0.22)", duration: 0.5 };
  var DIM = { borderColor: "#5A5A66", boxShadow: "0 0 0 0px rgba(255,69,43,0)", duration: 0.5 };
  function appear(id, t) { tl.fromTo("#n-" + id, { opacity: 0, y: 24, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, t); tl.to("#n-" + id, LIT, t); }
  function dim(id, t) { tl.to("#n-" + id, DIM, t); }
  function draw(id, t, d) { tl.to("#" + id, { opacity: 1, strokeDashoffset: 0, duration: d || 0.9, ease: "power2.inOut" }, t); }
  function fade(id, t) { tl.fromTo("#" + id, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, t); }
  function cap(i, a, b) {
    tl.fromTo("#cap" + i, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, a);
    if (b) tl.to("#cap" + i, { opacity: 0, duration: 0.4 }, b - 0.4);
  }
  tl.fromTo("#title", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.7 }, 0);
  tl.fromTo("#seal", { opacity: 0 }, { opacity: 1, duration: 0.7 }, 0.1);
  tl.fromTo("#legend", { opacity: 0 }, { opacity: 1, duration: 0.7 }, 0.3);

  // Beat 1: the ERP as single source of truth; five kinds of knowledge feed the hub
  cap(0, 0.6, 5.6);
  tl.fromTo("#n-erp", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" }, 0.8);
  tl.to("#n-erp", { boxShadow: "0 0 0 10px rgba(255,69,43,0.22)", duration: 0.6 }, 1.0);
  ["c1", "c2", "c3", "c4", "c5"].forEach(function (c, i) { appear(c, 1.6 + i * 0.5); draw("e-" + c, 1.9 + i * 0.5, 0.7); });
  tl.fromTo("#n-erp", { scale: 1 }, { scale: 1.04, duration: 0.7, yoyo: true, repeat: 1, ease: "sine.inOut" }, 4.2);

  // Beat 2: chips fold into the hub, spokes light up around it
  tl.to(["#n-c1", "#n-c2", "#n-c3", "#n-c4", "#n-c5"], { opacity: 0, scale: 0.6, duration: 0.6, ease: "power2.in" }, 5.4);
  tl.to(["#e-c1", "#e-c2", "#e-c3", "#e-c4", "#e-c5"], { opacity: 0, duration: 0.5 }, 5.4);
  cap(1, 5.6, 8.6);
  appear("flow", 6.2); draw("e-flow", 6.5);
  appear("ext", 7.2); draw("e-ext", 7.5);
  dim("flow", 8.4); dim("ext", 8.4);
  cap(2, 8.6, 12.4);
  appear("kb", 8.8); tl.to("#e-kb", { opacity: 1, duration: 0.6 }, 9.0); fade("p-kb", 9.3);
  appear("crm", 9.5); tl.to("#e-crm", { opacity: 1, duration: 0.6 }, 9.7); fade("p-crm", 10.0);
  appear("chan", 10.2); tl.to("#e-chan", { opacity: 1, duration: 0.6 }, 10.4); fade("p-chan", 10.7);
  appear("ai", 10.9); tl.to("#e-ai", { opacity: 1, duration: 0.6 }, 11.1); fade("p-ai", 11.4);
  tl.fromTo("#tag-ai", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 11.4);
  dim("kb", 12.2); dim("crm", 12.2); dim("chan", 12.2); dim("ai", 12.2);
  tl.to("#n-erp", { boxShadow: "0 0 0 0px rgba(255,69,43,0)", duration: 0.5 }, 12.2);

  // Beat 3: the builder composes any module and plugs it into the hub
  cap(3, 12.4, 15.4);
  tl.fromTo("#n-bld", { opacity: 0, y: 30, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 12.6);
  tl.to("#n-bld", LIT, 12.6);
  tl.fromTo("#tag-bld", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 13.2);
  cap(4, 15.4, 19.9);
  mods.forEach(function (m, i) {
    var t = 13.8 + i * 1.5;
    tl.to("#n-bld", { boxShadow: "0 0 0 10px rgba(255,69,43,0.32)", duration: 0.35, yoyo: true, repeat: 1 }, t - 0.4);
    tl.to("#b-" + m, { opacity: 1, duration: 0.5 }, t - 0.2);
    tl.fromTo("#n-" + m, { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, t);
    tl.to("#n-" + m, LIT, t);
    tl.to("#h-" + m, { opacity: 1, duration: 0.6 }, t + 0.5);
    tl.to("#n-erp", { boxShadow: "0 0 0 10px rgba(255,69,43,0.3)", duration: 0.3, yoyo: true, repeat: 1 }, t + 0.8);
  });

  // Closing: wide statement over the dimmed full picture
  tl.to("#captions", { opacity: 0, duration: 0.4 }, 19.5);
  tl.to("#stage", { opacity: 0.22, duration: 0.7 }, 19.9);
  tl.fromTo("#close", { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 20.0);
  tl.fromTo("#close div", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.7 }, 20.3);
  tl.fromTo("#close p", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 22.0);
  // Final hold, padded to exactly 23 s
  tl.fromTo("#pad", { opacity: 0 }, { opacity: 0.001, duration: 1 }, 22);

  window.__timelines = window.__timelines || {};
  window.__timelines["erp-hub"] = tl;
</script>
</body>
</html>
