<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Detalhes da cadeia</title>
<meta name="viewport" content="width=1920, height=1080">
<style>
/* BASE DA PEÇA (fonte e palco; cores e logos vêm da marca, nunca de arquivo local) */
@font-face{font-family:"Inter";src:url("../../_shared/vendor/fonts/Inter-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
html,body{margin:0;background:#10141C}
:root{--bg:#10141C;--panel:#17171B;--panel2:#202027;--line:#3A3A44;--muted:#B9B9C4;--amber:var(--wl-amber)}
*{box-sizing:border-box}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:"Inter",sans-serif;color:#fff;background:radial-gradient(1300px 760px at 50% 46%,#1A202B 0%,#10141C 72%)}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px}
.isl,.sc{position:absolute;left:0;top:0;width:1920px;height:1080px}
.bar{position:absolute;display:block;border-radius:10px;background:#2A2A33}
.bar.in{background:#262E35}

/* CASA: CONTORNO E CÔMODOS (cada cômodo tem ícone e rótulo de 40 px) */
.svgwrap{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
.svgwrap path,.svgwrap polyline{fill:none;stroke-linecap:butt;stroke-linejoin:round}
.roof{stroke:var(--amber);stroke-width:6}
.body{stroke:var(--line);stroke-width:4}
.seam{stroke:var(--amber);stroke-width:6}
.arr{stroke:var(--amber);stroke-width:6;stroke-linecap:round}
.room{position:absolute;z-index:3;display:flex;align-items:center;justify-content:center;border-radius:20px;background:var(--panel2);border:2px solid var(--line)}
.rbase{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.room b{font-size:48px;font-weight:600;line-height:54px;white-space:nowrap}
.ralt{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ralt b{font-size:48px;line-height:54px}

/* RELLOO: FUNIL DE QUATRO FAIXAS E O CARTÃO (um emblema por fato) */
.funnel{position:absolute;z-index:4;overflow:hidden;border-radius:24px;background:var(--panel);border:3px solid var(--line)}
.fstripe{position:absolute;border-radius:16px;background:#17171B;border:2px solid var(--line)}
.flab{position:absolute;display:flex;align-items:center;font-size:36px;line-height:42px;font-weight:700;color:var(--muted)}
.cardw{position:absolute;z-index:4}
.card{position:absolute;border-radius:16px;background:#262E38;border:2px solid #56626E}
.ct{position:absolute;left:20px;top:10px;font-size:48px;line-height:54px;font-weight:700;white-space:nowrap}
.ct.t2{top:62px}
.cb{position:absolute;width:46px;height:46px;border-radius:11px;border:2px solid #4A4A56;color:#6A6A76;display:grid;place-items:center}
.cb svg{display:block}
.sheet{position:absolute;z-index:30;border-radius:20px;background:#12161C;border:2px solid var(--amber)}
.srow{position:absolute;display:flex;align-items:center;gap:16px;font-size:44px;line-height:50px;font-weight:600;color:#fff;white-space:nowrap}
.slot{position:absolute;display:flex;align-items:center;gap:16px;padding:0 20px;border-radius:18px;background:#12161C;border:2px solid #3A3A44}
.si{display:flex;color:var(--amber)}
.sdash{flex:1;height:0;margin-left:8px;border-bottom:4px dashed #5A5A66}

/* TUNER: CAIXA DE ENTRADA ÚNICA (LISTA, CONVERSA, CHIPS DE CANAL, LIGAÇÃO E MENSAGEM NA MESMA THREAD) */
.tp{position:absolute;z-index:3;overflow:hidden;border-radius:26px;background:var(--panel);border:3px solid var(--line)}
.vdiv{position:absolute;background:#2A2A33}
.av{flex:none;width:68px;height:68px;border-radius:50%;background:#3A2E5C;display:grid;place-items:center;font-size:36px;font-weight:700}
.av i{font-style:normal}
.lrow{position:absolute;display:flex;align-items:center;gap:16px;padding:0 16px;border-radius:18px;background:#1E252C;border:2px solid #3A3A44}
.ln{display:flex;flex-direction:column;gap:10px}
.ln b{font-size:40px;line-height:46px;font-weight:700;white-space:nowrap}
.tags{display:flex;gap:10px}
.tag{height:54px;padding:0 16px;border:2px solid var(--amber);border-radius:27px;background:#2B2210;color:var(--amber);font-size:36px;font-weight:600;line-height:50px;white-space:nowrap}
.th{position:absolute;display:flex;align-items:center;gap:18px}
.th b{font-size:40px;line-height:46px;font-weight:700;white-space:nowrap}
.chip{position:absolute;height:56px;padding:0 20px;border:2px solid #4A4A56;border-radius:28px;background:#17171B;color:var(--muted);font-size:36px;font-weight:600;line-height:52px;white-space:nowrap}
.brk{position:absolute;background:var(--amber);border-radius:3px}
.callrow{position:absolute;display:flex;align-items:center;gap:16px;height:84px;padding:0 24px;border-radius:18px;background:#1E252C;font-size:44px;font-weight:600;color:#D5DDE2;white-space:nowrap}
.bub{position:absolute;padding:24px 44px;border-radius:30px;color:#E9EEF1;font-weight:500;font-size:60px;line-height:68px;white-space:nowrap}
.bub.out{background:#1E4D3A;border-top-right-radius:6px;font-size:56px}
.bub.in{background:#262E35;border-top-left-radius:6px}
.bub.q{font-size:52px;line-height:60px;padding:20px 40px}
.tx{display:block}
.recv{position:absolute;font-size:40px;line-height:46px;font-weight:600;color:#53D68A;white-space:nowrap}

/* KNOWLY: DOCUMENTO COM A LINHA DESTACADA E A RESPOSTA COM A FONTE */
.kp{position:absolute;z-index:3;overflow:hidden;border-radius:22px;background:var(--panel);border:3px solid var(--line)}
.kt{position:absolute;font-size:48px;font-weight:700;line-height:56px;color:#fff;white-space:nowrap}
.khl{position:absolute;border-radius:10px;background:rgba(255,176,32,.22);border-left:6px solid var(--amber)}
.kl{position:absolute;font-size:48px;line-height:56px;font-weight:600;color:#fff}
.kl span{display:block;white-space:nowrap}
.ap{position:absolute;z-index:3;border-radius:22px;background:var(--panel);border:3px solid var(--amber)}
.ans{position:absolute;font-size:84px;line-height:96px;font-weight:700;color:#fff;white-space:nowrap}
.srcpill{position:absolute;display:flex;align-items:center;gap:14px;height:76px;padding:0 28px;border-radius:38px;background:#2B2210;border:3px solid var(--amber);font-size:40px;font-weight:600;color:#fff;white-space:nowrap}

/* MAGNETO: TRÊS PASSOS, BOTÃO DE APROVAR, GESTORA E AS ETAPAS DO CARTÃO */
.step{position:absolute;display:flex;align-items:center;padding:0 36px;border-radius:22px;background:#1E252C;border:2px solid var(--line)}
.stx b{display:block;font-size:56px;line-height:64px;font-weight:600;white-space:nowrap}
.step .sok{position:absolute;right:20px;top:20px;color:#53D68A}
.step.btn{background:var(--amber);border-color:var(--amber);color:#1C1A16}
.step.btn .sok{display:none}
.step.btn .stx b{font-weight:700}
.mgr{position:absolute;z-index:3;display:flex;align-items:center;gap:20px;padding:0 24px;border-radius:30px;background:var(--panel);border:3px solid var(--line);white-space:nowrap}
.mgr .av{width:78px;height:78px;font-size:40px}
.mgr .mt{display:flex;flex-direction:column}
.mgr .mt b{font-size:44px;line-height:50px;font-weight:700}
.mgr .mt .dm{color:var(--muted);font-weight:600;font-size:36px;line-height:42px}
.stages{position:absolute;display:flex;gap:20px;align-items:center}
.pill{height:64px;padding:0 28px;border:2px solid #4A4A56;border-radius:32px;background:#17171B;color:var(--muted);font-size:36px;font-weight:600;line-height:60px;white-space:nowrap}

/* PACOTES, CHIPS EM VOO, DEDO E ONDA DO TOQUE */
.packet{position:absolute;z-index:26;width:64px;height:64px;border-radius:50%;background:var(--amber);display:grid;place-items:center;box-shadow:0 0 28px rgba(255,176,32,.5)}
.packet.rc{width:64px;height:64px}
.fchip{position:absolute;z-index:26;display:flex;align-items:center;gap:12px;height:80px;padding:0 30px;border-radius:40px;background:#2B2210;border:3px solid var(--amber);font-size:48px;font-weight:700;color:#fff;white-space:nowrap}
.finger{position:absolute;z-index:27;width:60px;height:60px;border-radius:50%;background:#fff;border:6px solid var(--amber)}
.ripple{position:absolute;z-index:26;width:170px;height:170px;border-radius:50%;border:6px solid #1C1A16}
img.logo{position:absolute;z-index:5;display:block}
</style>
</head>
<body>

<div id="root" data-composition-id="welabs-chain-detail-s1" data-brand="welabs" data-brand-scripts="welabs/welabs-brand.js" data-endorse="off" data-width="1920" data-height="1080" data-duration="42">
