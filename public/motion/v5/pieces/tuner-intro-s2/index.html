<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Abertura Tuner (definitiva s2, ondas do r em sintonia)</title>
<meta name="viewport" content="width=1920, height=1080">
<style>
/* BASE DA ABERTURA CONCEITUAL (mesma base das aberturas do Magneto, do Domus e do Relloo; a cena inteira é desenhada pela coreografia do Tuner) */
@font-face{font-family:"Inter";src:url("../../_shared/vendor/fonts/Inter-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
html,body{margin:0;background:#10141C}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#10141C;font-family:"Inter",sans-serif;color:#E6E6EC}
.role{position:absolute;left:0;width:1920px;height:56px;display:flex;flex-direction:column;align-items:center}
.bar{display:block;width:72px;height:4px;border-radius:2px;background:#FFB020;transform-origin:50% 50%;transform:scaleX(0)}
.word{display:block;margin-top:6px;font-size:44px;font-weight:500;letter-spacing:.02em;line-height:46px;opacity:0;white-space:nowrap}
/* Site variant v5: hidden slots, choreography untouched */
.role{display:none!important}
</style>
</head>
<body>
<div id="root" data-composition-id="tuner-intro-s2" data-brand="welabs" data-width="1920" data-height="1080" data-duration="5.4" data-tagline="Todo canal, uma conversa só.">
  <!-- Abertura conceitual do Tuner: sinais de cinco canais fora de sintonia chegam em zoom, a câmera recua e revela o dial (as ondas do "r"), os sinais entram em fase e o dial encolhe até o sinal do logo -->
  <img class="wm" alt="tuner by welabs" data-brand-src="welabs/tuner-endorsed-on-dark.svg">
  <div class="role"><span class="bar"></span><span class="word">Todo canal, uma conversa só.</span></div>
</div>
<script src="../../_shared/vendor/gsap/3.14.2/gsap.min.js"></script>
<script src="../../_shared/brand/loader.js"></script>
<script src="../../_shared/vendor/tuner-intro/1.0.0/choreography.js"></script>
<script>
// LINHA DO TEMPO DA PEÇA (coreografia Tuner 1.0.0; termina exatamente em data-duration)
// Focus (0-1.6 s): the camera sits at 1.55x on five channel chips (WhatsApp, voice, site chat, e-mail, Discord); each one sends a message bubble along its own out-of-tune wave to a common line that ends in a hub.
// Opening (1.6-2.2 s): the camera pulls back and reveals the dial (the two wave arcs of the sign, large, with a graduated track and a needle); the waves slide into the same wavelength and phase while the needle settles.
// Clack (2.3 s): the needle lands on zero, the arcs turn amber with a short flash and the channels shrink and fade for 0.16 s (no pop).
// Then the arcs shrink onto the waves of the "r" (2.45-3.25), the wordmark opens to the left, the seal and the tagline enter, and the still frame holds until 5.4 s.
window.__timelines = window.__timelines || {};
(function () {
  var DUR = 5.4;
  var root = document.getElementById('root');
  // tagline is a parameter (data-tagline); the default is the Tuner tagline chosen by the operator
  var tagline = root.getAttribute('data-tagline') || 'Todo canal, uma conversa só.';
  root.querySelector('.word').textContent = tagline;
  var tl = TunerIntro.build({ root: root, duration: DUR, safe: 100 });
  window.__timelines["tuner-intro-s2"] = tl;
})();
</script>
</body>
</html>
