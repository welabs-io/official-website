<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>IUS · Abertura</title>
<style>
/* BASE DA ABERTURA (o estilo da cena é injetado por assets/js/ius-intro.js) */
html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:#3D2BBE}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#3D2BBE}
</style>
</head>
<body>
<div id="root" data-composition-id="ius-intro" data-width="1920" data-height="1080" data-start="0" data-duration="9">
  <div id="intro"></div>
</div>
<script src="./assets/js/gsap.min.js"></script>
<script src="./assets/js/ius-intro.js"></script>
<script>
// REGISTRO DA TIMELINE: a abertura monta a cena no #intro e devolve a timeline pausada de 9 s
(function () {
  var tl = IUS_INTRO.mount(document.getElementById('intro'), gsap);
  window.__timelines = window.__timelines || {};
  window.__timelines['ius-intro'] = tl;
})();
</script>
</body>
</html>
