<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Família WeGO · Abertura</title>
<style>
/* BASE DA ABERTURA */
html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:#0d1210}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0d1210}
/* ABERTURA WEGO (bloco compartilhado com as versões dos filmes com abertura) */
@font-face{font-family:"WGI Inter";src:url("./assets/intro/Inter-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
#wgi{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;z-index:1000;background:#0d1210;font-family:"WGI Inter",Inter,sans-serif;color:#f3f6f4}
#wgi-bg,#wgi-fg{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
#wgi-title{position:absolute;left:0;top:332px;width:1920px;margin:0;text-align:center;font-size:112px;font-weight:700;letter-spacing:-.03em;line-height:136px;color:#f3f6f4;opacity:0}
#wgi-title span{font-weight:400;color:#b4c0ba}
#wgi-line{position:absolute;left:0;top:508px;width:1920px;margin:0;text-align:center;font-size:40px;font-weight:500;letter-spacing:-.01em;line-height:52px;color:#dfe7e3;opacity:0}
#wgi-key{position:absolute;left:760px;top:588px;width:400px;margin:0;text-align:center;font-size:26px;font-weight:500;line-height:32px;color:#b4c0ba;opacity:0}
.wgi-mod{position:absolute;top:610px;width:340px;margin:0;padding:0;opacity:0}
.wgi-plate{box-sizing:border-box;height:112px;margin:0;border-radius:20px;background:#F6F9F7;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 44px rgba(0,0,0,.38);font-size:36px;font-weight:700;letter-spacing:-.015em;line-height:44px;color:#10201a;white-space:nowrap}
.wgi-plate img{display:block;width:auto;max-width:none}
.wgi-plate i{font-style:normal;color:#15803d}
.wgi-cap{margin:18px 0 0;text-align:center;font-size:26px;font-weight:500;line-height:32px;color:#b4c0ba;white-space:nowrap}
</style>
</head>
<body>
<div id="root" data-composition-id="wego-intro" data-width="1920" data-height="1080" data-duration="8.5">
<!-- ABERTURA WEGO -->
<div id="wgi">
  <canvas id="wgi-bg" width="1920" height="1080" aria-hidden="true"></canvas>
  <canvas id="wgi-fg" width="1920" height="1080" aria-hidden="true"></canvas>
  <div id="wgi-key">nº do processo</div>
  <div id="wgi-title"><span>Família</span> WeGO</div>
  <div id="wgi-line">Do requerimento à licença, do campo ao processo</div>
  <div class="wgi-mod" id="wgi-m0" style="left:226px"><div class="wgi-plate"><img src="./assets/intro/docgo-color.svg" alt="DocGo" style="height:56px"></div><div class="wgi-cap">processos e documentos</div></div>
  <div class="wgi-mod" id="wgi-m1" style="left:602px"><div class="wgi-plate">Licenciamento</div><div class="wgi-cap">requerimento e licença</div></div>
  <div class="wgi-mod" id="wgi-m2" style="left:978px"><div class="wgi-plate">Auto&nbsp;<i>Infração</i></div><div class="wgi-cap">app do fiscal</div></div>
  <div class="wgi-mod" id="wgi-m3" style="left:1354px"><div class="wgi-plate"><img src="./assets/intro/signgo-color.svg" alt="SignGo" style="height:60px"></div><div class="wgi-cap">assinatura eletrônica</div></div>
</div>
</div>
<script src="./assets/js/gsap.min.js"></script>
<script src="./assets/intro/shaders.js"></script>
<script src="./assets/intro/choreography.js"></script>
<script>
// REGISTRO DA ABERTURA: a timeline montada pela coreografia é a única registrada
(function () {
  window.__timelines = window.__timelines || {};
  window.__timelines['wego-intro'] = WGI.build();
})();
</script>
</body>
</html>
