<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Sistema de Gerenciamento de Resíduos · Abertura</title>
<style>
/* BASE DA ABERTURA */
@font-face{font-family:"Inter";src:url("./assets/fonts/Inter-roman.var.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:block}
html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:#0a1a14}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:#0a1a14;font-family:"Inter",sans-serif;color:#fff}
#bg,#fg{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
.ri-k{position:absolute;top:196px;width:600px;text-align:center;font-size:26px;font-weight:800;letter-spacing:.1em;line-height:34px;color:#34d399;opacity:0}
.ri-l{position:absolute;font-size:32px;font-weight:600;letter-spacing:-.005em;line-height:40px;color:#F2FAF6;opacity:0;white-space:nowrap}
.ri-s{width:260px;text-align:center;top:556px}
#ring-c{position:absolute;left:350px;top:502px;width:300px;text-align:center;font-size:26px;font-weight:600;line-height:36px;color:#a9c7ba;opacity:0}
#name{position:absolute;left:0;top:462px;width:1920px;text-align:center;font-size:72px;font-weight:800;letter-spacing:-.015em;line-height:88px;color:#FFFFFF;opacity:0;white-space:nowrap}
#name span{color:#34d399}
#slogan{position:absolute;left:0;top:604px;width:1920px;text-align:center;font-size:36px;font-weight:500;letter-spacing:-.005em;line-height:46px;color:#a9c7ba;opacity:0}
</style>
</head>
<body>
<div id="root" data-composition-id="residuos-intro" data-width="1920" data-height="1080" data-duration="8.5">
  <canvas id="bg" width="1920" height="1080" aria-hidden="true"></canvas>
  <canvas id="fg" width="1920" height="1080" aria-hidden="true"></canvas>
  <div class="ri-k" id="k-rec" style="left:200px">RECICLAGEM</div>
  <div class="ri-k" id="k-tr" style="left:1020px">TRÂNSITO</div>
  <div class="ri-l" id="r0" style="left:350px;top:284px;width:300px;text-align:center">Ecoponto</div>
  <div class="ri-l" id="r1" style="left:672px;top:612px">Pesagem</div>
  <div class="ri-l" id="r2" style="right:1592px;top:612px;text-align:right">Recibo</div>
  <div id="ring-c">ciclo fechado</div>
  <div class="ri-l ri-s" id="s0" style="left:770px">MTR</div>
  <div class="ri-l ri-s" id="s1" style="left:1050px">Transporte</div>
  <div class="ri-l ri-s" id="s2" style="left:1330px">Destino</div>
  <div class="ri-l ri-s" id="s3" style="left:1610px">CDF</div>
  <div id="name">Sistema de Gerenciamento de <span>Resíduos</span></div>
  <div id="slogan">Da reciclagem ao destino final, um ciclo só.</div>
</div>
<script src="./assets/js/gsap.min.js"></script>
<script src="./assets/js/shaders.js"></script>
<script src="./assets/js/choreography.js"></script>
<script>
// RENDER DETERMINÍSTICO DA ABERTURA (WebGL2 no fundo + Canvas 2D por cima, dirigidos pela timeline)
(function () {
  var W = 1920, H = 1080, DURATION = 8.5;
  var bg = document.getElementById('bg');
  var ctx = document.getElementById('fg').getContext('2d');
  var gl = bg.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: true });
  var prog = null, uni = {}, vao = null;

  function compile() {
    var p = gl.createProgram();
    [[gl.VERTEX_SHADER, VS_QUAD], [gl.FRAGMENT_SHADER, FS_FIELD]].forEach(function (s) {
      var sh = gl.createShader(s[0]); gl.shaderSource(sh, s[1]); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
      gl.attachShader(p, sh); gl.deleteShader(sh);
    });
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    ['uRes', 'uFade', 'uFocus', 'uFocusAmt', 'uSettle'].forEach(function (n) { uni[n] = gl.getUniformLocation(p, n); });
    vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0); gl.bindVertexArray(null);
    return p;
  }
  if (gl) prog = compile();

  function render(t) {
    var f = SC.focusAt(t);
    if (gl && prog) {
      gl.viewport(0, 0, W, H); gl.useProgram(prog);
      gl.uniform2f(uni.uRes, W, H); gl.uniform1f(uni.uFade, SC.fadeAt(t));
      gl.uniform2f(uni.uFocus, f.p[0], f.p[1]); gl.uniform1f(uni.uFocusAmt, f.amt); gl.uniform1f(uni.uSettle, SC.settleAt(t));
      gl.bindVertexArray(vao); gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    SC.drawScene(ctx, t);
  }

  // TIMELINE (a única fonte de tempo): tween linear sobre um proxy dirige o render; rótulos, nome e slogan são DOM
  var proxy = { t: 0 };
  var tl = gsap.timeline({ paused: true });
  var OUT = SC.COL_T0 - 0.15;
  tl.to(proxy, { t: DURATION, duration: DURATION, ease: 'none', onUpdate: function () { render(proxy.t); } }, 0);
  tl.fromTo('#k-rec', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 0.25);
  SC.RING_ST_T0.forEach(function (t0, i) {
    tl.fromTo('#r' + i, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }, t0 + 0.1);
  });
  tl.fromTo('#ring-c', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out' }, SC.RING_CLOSED_T0 + 0.2);
  tl.fromTo('#k-tr', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, SC.ROUTE_T0);
  SC.ST_T0.forEach(function (t0, i) {
    tl.fromTo('#s' + i, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }, t0);
  });
  // One selector per string, so the intro merge can prefix each id (a comma-joined string escaped it)
  tl.to(['#k-rec', '#k-tr', '#r0', '#r1', '#r2', '#ring-c', '#s0', '#s1', '#s2', '#s3'], { opacity: 0, duration: 0.3, ease: 'power2.in' }, OUT);
  tl.fromTo('#name', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, SC.NAME_T0);
  tl.fromTo('#slogan', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, SC.SLOGAN_T0);
  render(0);
  window.__timelines = window.__timelines || {};
  window.__timelines['residuos-intro'] = tl;
})();
</script>
</body>
</html>
