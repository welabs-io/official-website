@keyframes p3{0%,50%{opacity:0;transform:scaleX(.2)}58%,86%{opacity:1;transform:none}96%,100%{opacity:0}}
.side .mv-sym{animation:sym 4.8s cubic-bezier(.3,1.3,.5,1) infinite}
.side .mv-sym [fill="#FFB020"],.side .mv-sym [stroke="#FFB020"]{animation:sig 4.8s cubic-bezier(.3,1.4,.5,1) infinite;transform-box:fill-box;transform-origin:center}
.side .mv-name{animation:name-after 4.8s cubic-bezier(.6,0,.2,1) infinite}
.word .mv-name{animation:name-first 4.8s cubic-bezier(.6,0,.2,1) infinite}
