<svg xmlns="http://www.w3.org/2000/svg" viewBox="-75.00 -75.00 790.92 434.10"><style>
.mv-sym,.mv-name,.mv-w1,.mv-w2,.mv-p1,.mv-p2,.mv-p3,.mv-sig{transform-box:fill-box;transform-origin:center}
@keyframes sym{0%,4%{transform:scale(.2);opacity:0}20%{transform:scale(1.08);opacity:1}28%,86%{transform:none;opacity:1}96%,100%{opacity:0}}
@keyframes sig{0%,26%{opacity:0;transform:scale(.4)}34%{opacity:1;transform:scale(1.15)}40%,86%{opacity:1;transform:none}96%,100%{opacity:0}}
@keyframes name-after{0%,30%{clip-path:inset(-20% 100% -20% 0)}56%,86%{clip-path:inset(-20% 0 -20% 0);opacity:1}96%,100%{opacity:0}}
@keyframes name-first{0%,4%{clip-path:inset(-20% 100% -20% 0)}34%,86%{clip-path:inset(-20% 0 -20% 0);opacity:1}96%,100%{opacity:0}}
@keyframes w1{0%,36%{opacity:0;transform:translateX(-12px) scale(.7)}46%,86%{opacity:1;transform:none}96%,100%{opacity:0}}
@keyframes w2{0%,46%{opacity:0;transform:translateX(-12px) scale(.7)}56%,86%{opacity:1;transform:none}96%,100%{opacity:0}}
@keyframes ring{0%,2%{stroke-dashoffset:1}24%,86%{stroke-dashoffset:0;opacity:1}96%,100%{opacity:0}}
@keyframes p1{0%,38%{opacity:0;transform:scaleX(.2)}46%,86%{opacity:1;transform:none}96%,100%{opacity:0}}
