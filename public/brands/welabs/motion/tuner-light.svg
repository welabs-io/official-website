.globe .mv-ring{stroke-dasharray:1;stroke-dashoffset:1;animation:ring 4.8s cubic-bezier(.6,0,.2,1) infinite}
.globe .mv-name{animation:name-first 4.8s cubic-bezier(.6,0,.2,1) infinite}
.globe .mv-p1{animation:p1 4.8s cubic-bezier(.3,1.3,.5,1) infinite}
.globe .mv-p2{animation:p2 4.8s cubic-bezier(.3,1.3,.5,1) infinite}
.globe .mv-p3{animation:p3 4.8s cubic-bezier(.3,1.3,.5,1) infinite}
@keyframes link{0%,34%{opacity:0;transform:translateY(-70px)}46%{opacity:1;transform:translateY(6px)}52%,86%{opacity:1;transform:none}96%,100%{opacity:0}}
.link .mv-name{animation:name-first 4.8s cubic-bezier(.6,0,.2,1) infinite}
.link .mv-link{animation:link 4.8s cubic-bezier(.3,1.2,.5,1) infinite}
@keyframes block{0%,4%{transform:scaleX(0)}26%,86%{transform:none;opacity:1}96%,100%{opacity:0}}
@keyframes we{0%,8%{opacity:0;transform:scale(.6)}26%{opacity:1;transform:scale(1.06)}32%,86%{opacity:1;transform:none}96%,100%{opacity:0}}
.brand .mv-block{transform-box:fill-box;transform-origin:left center;animation:block 4.8s cubic-bezier(.6,0,.2,1) infinite}
.brand .mv-we{transform-box:fill-box;transform-origin:center;animation:we 4.8s cubic-bezier(.3,1.3,.5,1) infinite}
.brand .mv-name{animation:name-after 4.8s cubic-bezier(.6,0,.2,1) infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;clip-path:none!important;stroke-dashoffset:0!important}}
