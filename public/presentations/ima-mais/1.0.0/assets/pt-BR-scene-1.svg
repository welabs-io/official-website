<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860"><defs><clipPath id="brand-viewport"><rect x="65" y="50" width="254" height="61"/></clipPath></defs><rect width="1200" height="860" fill="#f1f5f7"/><g font-family="Inter,Arial,sans-serif"><rect x="36" y="26" width="1128" height="108" rx="18" fill="#10141C"/><text x="60" y="92" fill="#FFFFFF" font-size="28" font-weight="600">IMA+</text><text x="375" y="74" fill="#FFFFFF" font-size="26" font-weight="650">IMA+</text><text x="375" y="108" fill="#FFFFFF" font-size="13" font-weight="400">EXPERIÊNCIA DE PRODUTO</text><rect x="36" y="153" width="423" height="588" rx="18" fill="#10141C"/><text x="66" y="205" fill="#FFFFFF" font-size="13" font-weight="600">CONTEXTO / DEMONSTRAÇÃO</text><text x="65" y="277" fill="#FFFFFF" font-size="42" font-weight="600">Consulta DEMO</text><text x="66" y="489" fill="#FFFFFF" font-size="21" font-weight="400">O acervo histórico pendente</text><text x="66" y="514.62" fill="#FFFFFF" font-size="21" font-weight="400">inspira uma consulta conceitual</text><text x="66" y="540.24" fill="#FFFFFF" font-size="21" font-weight="400">de requerimento DEMO. A cena</text><text x="66" y="565.86" fill="#FFFFFF" font-size="21" font-weight="400">não representa um serviço em</text><text x="66" y="591.48" fill="#FFFFFF" font-size="21" font-weight="400">operação.</text><rect x="482" y="153" width="677" height="588" rx="18" fill="#ffffff"/><text x="514" y="196" fill="#536d7a" font-size="13" font-weight="600">DADOS ILUSTRATIVOS</text><rect x="556" y="230" width="261" height="430" rx="26" fill="#162f3d"/><rect x="564" y="238" width="245" height="414" rx="20" fill="#f5f8fa"/><rect x="643" y="246" width="86" height="15" rx="8" fill="#162f3d"/><text x="586" y="297" fill="#173344" font-size="18" font-weight="600">Operação exemplo</text><rect x="580" y="325" width="212" height="71" rx="8" fill="#79B6A1"/><text x="595" y="355" fill="#000000" font-size="17" font-weight="600">Requerimento DEMO</text><text x="595" y="380" fill="#000000" font-size="12" font-weight="400">DEMO</text><rect x="580" y="414" width="212" height="71" rx="8" fill="#e5edf2"/><text x="595" y="444" fill="#173344" font-size="17" font-weight="600">Consulta exemplo</text><text x="595" y="469" fill="#536d7a" font-size="12" font-weight="400">DEMO</text><rect x="580" y="503" width="212" height="71" rx="8" fill="#e5edf2"/><text x="595" y="533" fill="#173344" font-size="17" font-weight="600">Contexto histórico</text><text x="595" y="558" fill="#536d7a" font-size="12" font-weight="400">DEMO</text><text x="863" y="350" fill="#173344" font-size="28" font-weight="600">Acervo DEMO</text><text x="863" y="466" fill="#536d7a" font-size="21" font-weight="400">Uma jornada digital</text><text x="863" y="491.62" fill="#536d7a" font-size="21" font-weight="400">com contexto.</text><text x="38" y="793" fill="#526678" font-size="17" font-weight="400">Recriação ilustrativa · dados fictícios</text><text x="38" y="828" fill="#526678" font-size="14" font-weight="400">Contexto histórico · operação atual não afirmada</text><text x="984" y="806" fill="#526678" font-size="18" font-weight="600">Imagine</text></g></svg>