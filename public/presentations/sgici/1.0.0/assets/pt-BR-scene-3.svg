<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860"><defs><clipPath id="brand-viewport"><rect x="65" y="50" width="254" height="61"/></clipPath></defs><rect width="1200" height="860" fill="#f1f5f7"/><g font-family="Inter,Arial,sans-serif"><rect x="36" y="26" width="1128" height="108" rx="18" fill="#10141C"/><text x="60" y="92" fill="#FFFFFF" font-size="28" font-weight="600">SGICI</text><text x="375" y="74" fill="#FFFFFF" font-size="26" font-weight="650">SGICI</text><text x="375" y="108" fill="#FFFFFF" font-size="13" font-weight="400">EXPERIÊNCIA DE PRODUTO</text><rect x="36" y="153" width="423" height="588" rx="18" fill="#10141C"/><text x="66" y="205" fill="#FFFFFF" font-size="13" font-weight="600">CONTEXTO / DEMONSTRAÇÃO</text><text x="65" y="277" fill="#FFFFFF" font-size="42" font-weight="600">Compare cenários</text><text x="66" y="489" fill="#FFFFFF" font-size="21" font-weight="400">Um índice abstrato permite</text><text x="66" y="514.62" fill="#FFFFFF" font-size="21" font-weight="400">observar diferenças visuais</text><text x="66" y="540.24" fill="#FFFFFF" font-size="21" font-weight="400">entre cenários DEMO. As formas</text><text x="66" y="565.86" fill="#FFFFFF" font-size="21" font-weight="400">são ilustrativas.</text><rect x="482" y="153" width="677" height="588" rx="18" fill="#ffffff"/><text x="514" y="196" fill="#536d7a" font-size="13" font-weight="600">DADOS ILUSTRATIVOS</text><text x="514" y="245" fill="#152c39" font-size="25" font-weight="600">Índice abstrato DEMO</text><rect x="529" y="515" width="47" height="75" rx="5" fill="#8EA4D2"/><rect x="611" y="480" width="47" height="110" rx="5" fill="#8EA4D2"/><rect x="693" y="504" width="47" height="86" rx="5" fill="#8EA4D2"/><rect x="775" y="445" width="47" height="145" rx="5" fill="#8EA4D2"/><rect x="857" y="470" width="47" height="120" rx="5" fill="#8EA4D2"/><rect x="939" y="405" width="47" height="185" rx="5" fill="#8EA4D2"/><rect x="1021" y="430" width="47" height="160" rx="5" fill="#8EA4D2"/><path d="M514 591H1120" stroke="#ccd8de" stroke-width="2"/><text x="514" y="639" fill="#536d7a" font-size="21" font-weight="400">Cenários ilustrativos</text><text x="514" y="698" fill="#536d7a" font-size="14" font-weight="400">Formas ilustram um cenário, não resultados reais.</text><text x="38" y="793" fill="#526678" font-size="17" font-weight="400">Recriação ilustrativa · dados fictícios</text><text x="984" y="806" fill="#526678" font-size="18" font-weight="600">Imagine</text></g></svg>