th="3"/><rect x="727" y="324" width="189" height="168" rx="10" fill="#edf3f6"/><rect x="744" y="344" width="31" height="31" rx="7" fill="#FF4025"/><text x="752" y="366" fill="#000000" font-size="18" font-weight="600">2</text><text x="744" y="413" fill="#173344" font-size="22" font-weight="600">Ação exemplo</text><path d="M917 410H940" stroke="#96b4c6" stroke-width="3"/><rect x="941" y="324" width="189" height="168" rx="10" fill="#edf3f6"/><rect x="958" y="344" width="31" height="31" rx="7" fill="#FF4025"/><text x="966" y="366" fill="#000000" font-size="18" font-weight="600">3</text><text x="958" y="413" fill="#173344" font-size="22" font-weight="600">Acompanhar</text><text x="514" y="603" fill="#536d7a" font-size="20" font-weight="400">Uma visão do trabalho, do início ao</text><text x="514" y="627.4" fill="#536d7a" font-size="20" font-weight="400">acompanhamento.</text><text x="38" y="793" fill="#526678" font-size="17" font-weight="400">Recriação ilustrativa · dados fictícios</text><text x="984" y="806" fill="#526678" font-size="18" font-weight="600">Imagine</text></g></svg>